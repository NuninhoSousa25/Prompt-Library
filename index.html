<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Dashboard (Exp)</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --card-bg: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --accent-color: #4a9eff;
            --accent-hover: #357abd;
            --danger-color: #cf6679;
        }

        body.light-mode {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #121212;
            --text-secondary: #555555;
            --border-color: #e0e0e0;
            --accent-color: #007bff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            /* App-like feel */
            display: flex;
        }

        /* --- Left Sidebar (Nav & Filters) --- */
        .sidebar-left {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-size: 0.9rem;
        }

        .category-btn:hover,
        .category-btn.active {
            background-color: rgba(74, 158, 255, 0.15);
            color: var(--accent-color);
        }

        /* Category Tree Styles */
        .category-node {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 2px;
        }

        .category-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.7rem;
            transition: transform 0.2s;
            background: none;
            border: none;
            padding: 0;
        }

        .category-toggle:hover {
            color: var(--text-primary);
        }

        .category-toggle.rotated {
            transform: rotate(90deg);
        }

        .category-toggle.invisible {
            visibility: hidden;
        }

        .category-button {
            flex: 1;
            text-align: left;
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-button:hover,
        .category-button.active {
            background-color: rgba(74, 158, 255, 0.15);
            color: var(--accent-color);
        }

        .category-sub-list {
            list-style: none;
            padding-left: 1.25rem;
            display: none;
            flex-direction: column;
            gap: 2px;
        }

        .category-sub-list.open {
            display: flex;
        }

        .category-node.drag-over {
            background-color: rgba(74, 158, 255, 0.25);
            outline: 1px dashed var(--accent-color);
            border-radius: 4px;
        }

        .category-node.drag-over-top {
            border-top: 2px solid var(--accent-color);
        }

        .category-node.drag-over-bottom {
            border-bottom: 2px solid var(--accent-color);
        }

        .category-list.drag-over {
            background-color: rgba(255, 255, 255, 0.05);
            outline: 1px dashed var(--text-secondary);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5) inset;
        }

        .bottom-actions {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        /* --- Center Stage (Feed) --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            /* Fix flex overflow */
        }

        .top-bar {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            justify-content: space-between;
            background-color: var(--bg-color);
        }

        .search-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
            width: 300px;
            font-size: 0.9rem;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Card Styles */
        .prompt-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .prompt-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-color: #555;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .card-category {
            font-size: 0.75rem;
            background-color: #333;
            color: #ccc;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            display: inline-block;
        }

        .card-body {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            flex: 1;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: hidden;
            position: relative;
        }

        .card-body.masked::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--card-bg));
        }

        .card-body.expanded {
            max-height: none;
            overflow-y: visible;
        }

        .card-body.expanded::after {
            display: none;
        }

        /* Markdown Styles */
        .card-body pre {
            background-color: #1a1a1a;
            padding: 2rem 0.8rem 0.8rem 0.8rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0;
            border: 1px solid var(--border-color);
        }
        
        .code-block-wrapper {
            position: relative;
            margin: 0.5rem 0;
        }

        .copy-code-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: 0.2s;
        }
        
        .copy-code-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .card-body code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            color: #dcdcaa;
        }

        .card-body pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        .card-body strong {
            color: white;
            font-weight: 700;
        }

        .card-body em {
            color: var(--text-primary);
        }
        
        mark {
            background: rgba(74, 158, 255, 0.3);
            color: white;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* Tag UI */
        .tag-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            min-height: 24px;
        }
        .tag-chip {
            background-color: var(--accent-color);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .tag-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            margin-top: -0.5rem;
            max-height: 100px;
            overflow-y: auto;
        }
        .tag-suggestion-item {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tag-suggestion-item:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background-color: var(--border-color);
            color: white;
        }

        .btn-add-build {
            color: var(--accent-color);
        }

        .btn-delete:hover {
            color: var(--danger-color);
        }

        /* --- Right Sidebar (Builder) --- */
        .sidebar-right {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: none; /* Hidden by default */
            flex-direction: column;
            padding: 1.5rem;
            flex-shrink: 0;
        }

        .sidebar-right.open {
            display: flex;
        }

        .builder-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .builder-textarea {
            flex: 1;
            background-color: #121212;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem;
            resize: none;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-family: inherit;
            line-height: 1.5;
        }

        .builder-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .builder-controls {
            display: flex;
            gap: 0.5rem;
        }

        .full-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-copy {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        /* Modal & Toast (Reused) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            width: 800px;
            max-width: 95vw;
            max-height: 95vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        input,
        textarea.form-input {
            width: 100%;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.8rem;
            margin-bottom: 0.75rem;
            border-radius: 4px;
        }

        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        #toast.show {
            opacity: 1;
            bottom: 3rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 3rem;
            font-size: 1.1rem;
        }

        @media (max-width: 1000px) {
            .sidebar-right {
                position: fixed;
                right: -320px;
                top: 0;
                bottom: 0;
                z-index: 1000;
                transition: right 0.3s;
                display: flex !important; /* Override display: none */
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }

            .sidebar-right.open {
                right: 0;
            }

            #mobileBuilderBtn {
                display: block !important;
            }

            #closeBuilderBtn {
                display: block !important;
            }
        }
    </style>
</head>

<body>

    <!-- Left Sidebar -->
    <aside class="sidebar-left">
        <div class="app-title">⚡ Prompt Lib</div>

        <div class="nav-section">
            <div class="nav-label">Categories</div>
            <ul class="category-list" id="categoryList">
                <li><button class="category-btn active" data-cat="all">All Prompts</button></li>
                <!-- Categories injected here -->
            </ul>
        </div>

        <div class="bottom-actions">
            <button class="category-btn" id="manageCatsBtn">Manage Categories</button>
            <button class="category-btn" id="themeBtn">Toggle Theme</button>
            <button class="category-btn" id="exportBtn">Export JSON</button>
            <button class="category-btn" id="importBtn">Import JSON</button>
            <input type="file" id="importInput" accept=".json" style="display: none;">
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search prompts...">
            <div style="display: flex; gap: 0.5rem;">
                <button class="action-btn" id="toggleBuilderBtn" style="display: flex; align-items: center; gap: 0.5rem; border: 1px solid var(--border-color); font-weight: 500;" title="Toggle Builder">
                    <span style="font-size: 1.2rem;">◫</span> Prompt Builder
                </button>
                <button class="add-btn" id="openAddModalBtn">+ New Prompt</button>
            </div>
        </header>

        <div class="scroll-area">
            <div class="prompt-grid" id="promptGrid">
                <!-- Cards injected here -->
            </div>
        </div>
    </main>

    <!-- Right Sidebar (Builder) -->
    <aside class="sidebar-right" id="builderSidebar">
        <div class="nav-label" style="display: flex; justify-content: space-between; align-items: center;">
            Prompt Builder
            <button id="closeBuilderBtn" class="action-btn" style="display: none; font-size: 1.2rem;">&times;</button>
        </div>
        <div class="builder-container">
            <textarea class="builder-textarea" id="builderArea"
                placeholder="Click (+) on cards to add prompts here. Edit and combine them..."></textarea>
            <div class="builder-controls">
                <button class="full-btn btn-clear" id="clearBuilder">Clear</button>
                <button class="full-btn btn-copy" id="copyBuilder">Copy All</button>
            </div>
        </div>
    </aside>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Manage Prompt</h2>
            <input type="text" id="modalName" placeholder="Prompt Name">
            <div id="tagPreview" class="tag-preview"></div>
            <input type="text" id="modalCategory" placeholder="Tags (comma separated)" autocomplete="off">
            <div id="tagSuggestions" class="tag-suggestions"></div>
            <textarea class="form-input" id="modalContent" style="min-height: 400px;"
                placeholder="Prompt Text"></textarea>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="full-btn btn-clear" id="closeModal"
                    style="width: auto; padding: 0.6rem 1.5rem;">Cancel</button>
                <button class="full-btn btn-copy" id="saveModal"
                    style="width: auto; padding: 0.6rem 1.5rem;">Save</button>
            </div>
        </div>
    </div>

    <!-- Category Manager Modal -->
    <div class="modal-overlay" id="catModal">
        <div class="modal-content" style="width: 400px;">
            <h2 style="margin-bottom: 1rem;">Categories</h2>
            <p style="color:var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">Click to rename. (Updates
                all prompts)</p>
            <div id="catManagerList"
                style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;"></div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="full-btn btn-clear" id="closeCatModal" style="width: auto;">Close</button>
            </div>
        </div>
    </div>

    <!-- Variable Input Modal -->
    <div class="modal-overlay" id="varModal">
        <div class="modal-content" style="width: 400px;">
            <h2 style="margin-bottom: 1rem;">Enter Variables</h2>
            <div id="varModalInputs" style="max-height: 300px; overflow-y: auto;"></div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="full-btn btn-clear" id="closeVarModal" style="width: auto;">Cancel</button>
                <button class="full-btn btn-copy" id="confirmVarModal" style="width: auto;">Copy</button>
            </div>
        </div>
    </div>

    <div id="toast">Copied!</div>

    <script>
        // --- Data Layer ---
        class PromptManager {
            constructor() {
                this.prompts = JSON.parse(localStorage.getItem('prompts')) || [];
                // Load category order, or init empty
                this.categoryOrder = JSON.parse(localStorage.getItem('categoryOrder')) || [];
                this.migrate();
            }

            migrate() {
                let changed = false;
                this.prompts.forEach(p => {
                    if (!p.id) {
                        p.id = this.generateId();
                        changed = true;
                    }
                });
                
                // Cleanup categories on load/migrate
                const activeCats = this.getActiveCategories();
                this.cleanupCategoryOrder(activeCats);
                
                if (changed) this.save();
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            getAll() {
                return this.prompts;
            }

            get(id) {
                return this.prompts.find(p => p.id === id);
            }

            add(prompt) {
                prompt.id = this.generateId();
                this.prompts.unshift(prompt);
                this.save();
            }

            update(id, data) {
                const index = this.prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.prompts[index] = { ...this.prompts[index], ...data };
                    this.save();
                    // Cleanup after potential category change
                    this.cleanupCategoryOrder(this.getActiveCategories());
                }
            }

            delete(id) {
                const index = this.prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.prompts.splice(index, 1);
                    this.save();
                    // Cleanup after deletion
                    this.cleanupCategoryOrder(this.getActiveCategories());
                }
            }

            save() {
                localStorage.setItem('prompts', JSON.stringify(this.prompts));
            }

            saveOrder() {
                localStorage.setItem('categoryOrder', JSON.stringify(this.categoryOrder));
            }

            cleanupCategoryOrder(activeCategories) {
                const activeSet = new Set(activeCategories);
                const newOrder = this.categoryOrder.filter(cat => activeSet.has(cat));
                
                if (newOrder.length !== this.categoryOrder.length) {
                    this.categoryOrder = newOrder;
                    this.saveOrder();
                }
            }
            
            // Helper to get raw active category list
            getActiveCategories() {
                const tags = new Set();
                this.prompts.forEach(p => {
                    if (p.category) {
                        p.category.split(',').map(tag => tag.trim()).filter(Boolean).forEach(tag => tags.add(tag));
                    }
                });
                return Array.from(tags);
            }

            getCategories() {
                const catArray = this.getActiveCategories();

                // Sort based on saved order
                catArray.sort((a, b) => {
                    const idxA = this.categoryOrder.indexOf(a);
                    const idxB = this.categoryOrder.indexOf(b);

                    // If both are in the list, respect order
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    // If only A is in list, A comes first
                    if (idxA !== -1) return -1;
                    // If only B is in list, B comes first
                    if (idxB !== -1) return 1;
                    // Otherwise sort alphabetically
                    return a.localeCompare(b);
                });

                return catArray;
            }

            reorderCategory(moved, target, position) {
                // Ensure order list handles all current categories
                const currentCats = this.getCategories(); // This returns them partly sorted, partly alpha
                // We need to merge existing order with any new ones found

                const fullOrder = [...this.categoryOrder];
                currentCats.forEach(c => {
                    if (!fullOrder.includes(c)) fullOrder.push(c);
                });

                const movedIdx = fullOrder.indexOf(moved);
                if (movedIdx === -1) return; // Should not happen

                // Remove moved
                fullOrder.splice(movedIdx, 1);

                // Find target index
                let targetIdx = fullOrder.indexOf(target);
                if (targetIdx === -1) {
                    // Fallback append
                    fullOrder.push(moved);
                } else {
                    if (position === 'after') targetIdx++;
                    fullOrder.splice(targetIdx, 0, moved);
                }

                this.categoryOrder = fullOrder;
                this.saveOrder();
            }

            renameCategory(oldName, newName) {
                let changed = false;
                this.prompts.forEach(p => {
                    if (p.category) {
                        const tags = p.category.split(',').map(t => t.trim());
                        if (tags.includes(oldName)) {
                            p.category = tags.map(t => t === oldName ? newName : t).join(', ');
                            changed = true;
                        }
                    }
                });
                if (changed) this.save();
                return changed;
            }

            moveCategory(oldPath, newParentPath) {
                const name = oldPath.split('/').pop();
                const newPath = newParentPath ? `${newParentPath}/${name}` : name;

                // Prevent moving into self or children
                if (newParentPath && (newParentPath === oldPath || newParentPath.startsWith(oldPath + '/'))) {
                    return false;
                }

                let changed = false;
                this.prompts.forEach(p => {
                    if (p.category) {
                        const tags = p.category.split(',').map(t => t.trim());
                        const newTags = tags.map(tag => {
                            if (tag === oldPath || tag.startsWith(oldPath + '/')) {
                                changed = true;
                                return newPath + tag.substring(oldPath.length);
                            }
                            return tag;
                        });
                        p.category = newTags.join(', ');
                    }
                });

                if (changed) this.save();
                return changed;
            }
        }

        // --- UI Layer ---
        class UIManager {
            constructor(promptManager) {
                this.promptManager = promptManager;
                this.activeCategory = 'all';
                this.searchTerm = '';

                // Elements
                this.grid = document.getElementById('promptGrid');
                this.catList = document.getElementById('categoryList');
                this.modal = document.getElementById('modal');
                this.builderArea = document.getElementById('builderArea');
                this.toast = document.getElementById('toast');

                // Modal Inputs
                this.modalName = document.getElementById('modalName');
                this.modalCategory = document.getElementById('modalCategory');
                this.tagPreview = document.getElementById('tagPreview');
                this.tagSuggestions = document.getElementById('tagSuggestions');
                this.modalContent = document.getElementById('modalContent');

                this.editingId = null;
                
                // Variable Modal
                this.varModal = document.getElementById('varModal');
                this.varInputsContainer = document.getElementById('varModalInputs');
                this.pendingCopyText = null;

                this.initTheme();
                this.bindEvents();
            }

            debounce(func, wait) {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            bindEvents() {
                document.getElementById('openAddModalBtn').addEventListener('click', () => this.openModal());
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                document.getElementById('saveModal').addEventListener('click', () => this.handleSaveModal());
                this.modalCategory.addEventListener('input', () => this.handleTagInput());

                // Cat Manager
                document.getElementById('manageCatsBtn').addEventListener('click', () => this.openCatManager());
                document.getElementById('closeCatModal').addEventListener('click', () => document.getElementById('catModal').classList.remove('open'));

                // Theme
                document.getElementById('themeBtn').addEventListener('click', () => this.toggleTheme());

                // Variable Modal
                document.getElementById('closeVarModal').addEventListener('click', () => this.closeVarModal());
                document.getElementById('confirmVarModal').addEventListener('click', () => this.handleVarSubmit());

                // Builder Toggle
                document.getElementById('toggleBuilderBtn').addEventListener('click', () => {
                    document.getElementById('builderSidebar').classList.toggle('open');
                });
                document.getElementById('closeBuilderBtn').addEventListener('click', () => {
                    document.getElementById('builderSidebar').classList.remove('open');
                });

                document.getElementById('copyBuilder').addEventListener('click', () => this.copyBuilderText());
                document.getElementById('clearBuilder').addEventListener('click', () => this.builderArea.value = '');

                document.getElementById('searchInput').addEventListener('input', this.debounce((e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.renderPrompts();
                }, 250));

                document.getElementById('exportBtn').addEventListener('click', () => this.exportPrompts());
                document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());
                document.getElementById('importInput').addEventListener('change', (e) => this.importPrompts(e));

                // Global access for onclick handlers in HTML (legacy support for inline onclicks)
                window.setCategory = (cat) => this.setCategory(cat);
                window.addToBuilder = (id) => this.addToBuilder(id);
                window.deletePrompt = (id) => this.deletePrompt(id);
                window.copyPrompt = (id) => this.copyPrompt(id);
                window.downloadPrompt = (id) => this.downloadPrompt(id);
                window.copyText = (text) => this.copyText(text);
                window.openEdit = (id) => this.openModal(id);
                window.toggleExpand = (btn, id) => this.toggleExpand(btn, id);
                window.copyCodeBlock = (btn) => this.copyCodeBlock(btn);
                window.addTag = (tag) => this.addTag(tag);
            }

            init() {
                this.renderPrompts();
                this.renderCategories();
            }

            initTheme() {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'light') {
                    document.body.classList.add('light-mode');
                }
            }

            toggleTheme() {
                document.body.classList.toggle('light-mode');
                const theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
                localStorage.setItem('theme', theme);
            }

            setCategory(cat) {
                this.activeCategory = cat;
                this.renderPrompts();
                this.updateActiveCategoryUI();
            }

            updateActiveCategoryUI() {
                // Remove active class from all
                document.querySelectorAll('.category-button, .category-btn').forEach(b => b.classList.remove('active'));

                // Add to current
                if (this.activeCategory === 'all') {
                    const allBtn = document.getElementById('cat-btn-all');
                    if (allBtn) allBtn.classList.add('active');
                } else {
                    // Match by data-cat attribute
                    const btn = document.querySelector(`.category-button[data-cat="${this.activeCategory.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"]`);
                    if (btn) btn.classList.add('active');
                }
            }

            // Build Tree: { name: 'A', fullPath: 'A', children: { 'B': { name: 'B', fullPath: 'A/B', children: {} } } }
            buildTree(tags) {
                const tree = {};
                tags.forEach(tag => {
                    const parts = tag.split('/');
                    let currentLevel = tree;
                    let currentPath = '';

                    parts.forEach((part, index) => {
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        if (!currentLevel[part]) {
                            currentLevel[part] = {
                                name: part,
                                fullPath: currentPath,
                                children: {}
                            };
                        }
                        currentLevel = currentLevel[part].children;
                    });
                });
                return tree;
            }

            renderCategories() {
                const categories = this.promptManager.getCategories(); // Now returns sorted array
                // buildTree needs to respect array order
                const tree = this.buildTree(categories);

                this.catList.innerHTML = '';

                // "All Prompts" special item
                const allLi = document.createElement('li');
                allLi.innerHTML = `
                    <div class="category-node" id="cat-root-dropzone">
                        <span class="category-toggle invisible">▶</span>
                        <button id="cat-btn-all" class="category-button ${this.activeCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">All Prompts</button>
                    </div>`;
                this.catList.appendChild(allLi);

                // Enable drop on Root
                const rootZone = allLi.querySelector('.category-node');
                this.setupDropZone(rootZone, null);

                this.renderTreeLevel(tree, this.catList);

                // Allow dropping on the empty list area to move to root
                this.setupDropZone(this.catList, null);
            }

            setupDropZone(element, path) {
                element.ondragover = (e) => this.handleDragOver(e, element, path);
                element.ondragleave = (e) => this.handleDragLeave(e, element);
                element.ondrop = (e) => this.handleDrop(e, element, path);
            }

            handleDragOver(e, element, path) {
                e.preventDefault();
                e.stopPropagation();

                if (element === this.catList) {
                    element.classList.add('drag-over');
                    return;
                }

                const rect = element.getBoundingClientRect();
                const relY = e.clientY - rect.top;
                const height = rect.height;

                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');

                if (path === null) {
                    // Root (All Prompts) only supports nesting (moving to root)
                    element.classList.add('drag-over');
                    return;
                }

                // Logic: Top 25% = before, Bottom 25% = after, Middle = nest
                if (relY < height * 0.25) {
                    element.classList.add('drag-over-top');
                    element.dataset.dropAction = 'before';
                } else if (relY > height * 0.75) {
                    element.classList.add('drag-over-bottom');
                    element.dataset.dropAction = 'after';
                } else {
                    element.classList.add('drag-over');
                    element.dataset.dropAction = 'inside';
                }
            }

            handleDragLeave(e, element) {
                e.stopPropagation();
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
            }

            handleDrop(e, element, path) {
                e.preventDefault();
                e.stopPropagation();
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');

                const oldPath = e.dataTransfer.getData("text/plain");
                if (!oldPath) return;

                // Moving to Empty Space -> To Root
                if (element === this.catList || path === null) {
                    if (this.promptManager.moveCategory(oldPath, null)) {
                        this.refreshUI();
                        this.showToast("Moved to Top Level");
                    }
                    return;
                }

                const action = element.dataset.dropAction;

                if (action === 'inside') {
                    if (this.promptManager.moveCategory(oldPath, path)) {
                        this.refreshUI();
                        this.showToast("Nested Category");
                    }
                } else if (action === 'before' || action === 'after') {
                    this.promptManager.reorderCategory(oldPath, path, action);
                    this.refreshUI();
                    this.showToast("Reordered Category");
                }
            }

            refreshUI() {
                this.renderPrompts();
                this.renderCategories();
            }

            renderTreeLevel(nodes, container) {
                // Object.keys is arbitrary order, we must use the sorted order from promptManager
                // BUT buildTree returns a generic object.
                // We need to iterate our sorted categories list and pick out nodes that belong to this level.

                // Better approach: buildTree already iterated the sorted list?
                // Actually, buildTree returns an object. Object traversal order is not guaranteed to receive sorted keys? 
                // Actually in modern JS it is insertion order for strings. 
                // But PromptManager.getCategories returns FULL paths.

                // Updated Strategy: We will iterate the `nodes` object's keys, 
                // but we need to sort THEM based on our global sort order?
                // That's tricky because global order is full paths (A, B, A/C).

                // Simplify: Just sort the keys of 'nodes' based on their index in the global list if possible, or just alphabetical if not found?
                // Actually the node has `fullPath`. We can use that.

                const sortedKeys = Object.keys(nodes).sort((a, b) => {
                    // Compare nodes[a].fullPath vs nodes[b].fullPath using manager's logic
                    const pathA = nodes[a].fullPath;
                    const pathB = nodes[b].fullPath;
                    const allCats = this.promptManager.getCategories(); // This is the sorted array
                    return allCats.indexOf(pathA) - allCats.indexOf(pathB);
                });

                sortedKeys.forEach(key => {
                    const node = nodes[key];
                    const hasChildren = Object.keys(node.children).length > 0;

                    const li = document.createElement('li');

                    // Header
                    const row = document.createElement('div');
                    row.className = 'category-node';
                    row.draggable = true;

                    // Drag Start
                    row.ondragstart = (e) => {
                        e.dataTransfer.setData("text/plain", node.fullPath);
                        e.stopPropagation(); // Prevent bubbling
                    };

                    // Drop Zone
                    this.setupDropZone(row, node.fullPath);

                    const toggle = document.createElement('button');
                    toggle.className = `category-toggle ${hasChildren ? '' : 'invisible'}`;
                    toggle.textContent = '▶';
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.onclick = (e) => {
                        e.stopPropagation();
                        this.toggleSubMenu(toggle, subList);
                    };

                    const btn = document.createElement('button');
                    btn.className = `category-button ${this.activeCategory === node.fullPath ? 'active' : ''}`;
                    btn.textContent = node.name;
                    btn.dataset.cat = node.fullPath;
                    btn.onclick = () => this.setCategory(node.fullPath);

                    row.appendChild(toggle);
                    row.appendChild(btn);
                    li.appendChild(row);

                    // Children
                    const subList = document.createElement('ul');
                    subList.className = 'category-sub-list';

                    if (hasChildren) {
                        this.renderTreeLevel(node.children, subList);
                    }

                    li.appendChild(subList);
                    container.appendChild(li);
                });
            }

            toggleSubMenu(toggle, list) {
                const isOpen = list.classList.toggle('open');
                toggle.classList.toggle('rotated');
                toggle.setAttribute('aria-expanded', isOpen);
            }

            parseMarkdown(text) {
                if (!text) return '';
                // 1. Escape HTML
                let html = text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");

                // 2. Code Blocks
                html = html.replace(/```([\s\S]*?)```/g, (match, code) => {
                    return `<div class="code-block-wrapper"><button class="copy-code-btn" onclick="copyCodeBlock(this)">Copy Code</button><pre><code>${code}</code></pre></div>`;
                });

                // 3. Inline Code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // 4. Bold
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

                // 5. Italic
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

                return html;
            }

            highlightText(text, terms) {
                let safe = this.escapeHtml(text);
                if (!terms || terms.length === 0) return safe;
                
                const safeTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                const pattern = new RegExp(`(${safeTerms.join('|')})`, 'gi');
                return safe.replace(pattern, '<mark>$1</mark>');
            }

            renderPrompts() {
                const prompts = this.promptManager.getAll();
                const fragment = document.createDocumentFragment();
                const searchTokens = this.searchTerm.toLowerCase().split(/\s+/).filter(Boolean);

                // Filter
                const filtered = prompts.filter(p => {
                    const pTags = p.category ? p.category.split(',').map(t => t.trim()) : [];

                    // Match: Exact match OR Path match (e.g. "Work" matches "Work/Project")
                    const matchesCat = this.activeCategory === 'all' || pTags.some(tag =>
                        tag === this.activeCategory || tag.startsWith(this.activeCategory + '/')
                    );

                    const nameLower = p.name.toLowerCase();
                    const contentLower = p.content.toLowerCase();
                    
                    const matchesSearch = searchTokens.length === 0 || searchTokens.every(token => 
                        nameLower.includes(token) || contentLower.includes(token)
                    );

                    return matchesCat && matchesSearch;
                });

                if (filtered.length === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    emptyState.textContent = 'No prompts found.';
                    this.grid.innerHTML = '';
                    this.grid.appendChild(emptyState);
                    return;
                }

                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'prompt-card';
                    const isLong = p.content.length > 100;

                    const tagsHtml = p.category ? p.category.split(',').map(tag => `<span class="card-category">${this.escapeHtml(tag.trim())}</span>`).join(' ') : '';
                    const contentHtml = this.parseMarkdown(p.content);
                    const titleHtml = this.highlightText(p.name, searchTokens);

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="card-title">${titleHtml}</div>
                                ${tagsHtml}
                            </div>
                        </div>
                        <div class="card-body ${isLong ? 'masked' : ''}" id="card-body-${p.id}">${contentHtml}</div>
                        <div class="card-actions">
                            <button class="action-btn" aria-label="Copy Prompt" onclick="copyPrompt('${p.id}')">Copy</button>
                            <button class="action-btn" aria-label="Download" title="Download as .md" onclick="downloadPrompt('${p.id}')">⬇</button>
                            ${isLong ? `<button class="action-btn" aria-label="Toggle Expand" onclick="toggleExpand(this, '${p.id}')">Expand</button>` : ''}
                            <button class="action-btn btn-add-build" aria-label="Add to Builder" title="Add to Builder" onclick="addToBuilder('${p.id}')">✚ Add</button>
                            <button class="action-btn" aria-label="Edit Prompt" onclick="openEdit('${p.id}')">Edit</button>
                            <button class="action-btn btn-delete" aria-label="Delete Prompt" onclick="deletePrompt('${p.id}')">Del</button>
                        </div>
                    `;
                    fragment.appendChild(card);
                });

                this.grid.innerHTML = '';
                this.grid.appendChild(fragment);
            }

            // Actions
            addToBuilder(id) {
                const prompt = this.promptManager.get(id);
                if (prompt) {
                    this.builderArea.value += (this.builderArea.value ? '\n\n' : '') + prompt.content;
                    this.showToast("Added to Builder");
                }
            }

            copyBuilderText() {
                if (!this.builderArea.value) return;
                this.copyText(this.builderArea.value);
            }

            copyPrompt(id) {
                const prompt = this.promptManager.get(id);
                if (prompt) {
                    this.copyText(prompt.content);
                }
            }

            downloadPrompt(id) {
                const p = this.promptManager.get(id);
                if (!p) return;
                const blob = new Blob([p.content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${p.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                a.click();
                URL.revokeObjectURL(url);
            }

            copyText(text) {
                // Regex to find text inside {{ double curly braces }}
                const variables = [...text.matchAll(/\{\{(.*?)\}\}/g)];

                if (variables.length > 0) {
                    this.openVarModal(text, variables);
                } else {
                    navigator.clipboard.writeText(text);
                    this.showToast("Copied!");
                }
            }

            copyCodeBlock(btn) {
                const pre = btn.nextElementSibling;
                if (pre) {
                    navigator.clipboard.writeText(pre.innerText);
                    const original = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = original, 2000);
                }
            }

            openVarModal(text, variables) {
                this.pendingCopyText = text;
                this.varInputsContainer.innerHTML = '';
                
                // Deduplicate variables
                const uniqueVars = [...new Set(variables.map(m => m[1]))];

                uniqueVars.forEach(v => {
                    const label = document.createElement('label');
                    label.style.display = 'block';
                    label.style.marginBottom = '0.5rem';
                    label.style.color = 'var(--text-secondary)';
                    label.style.fontSize = '0.9rem';
                    label.textContent = v;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.dataset.varName = v;
                    input.placeholder = `Value for ${v}`;
                    
                    this.varInputsContainer.appendChild(label);
                    this.varInputsContainer.appendChild(input);
                });

                this.varModal.classList.add('open');
                // Focus first input
                setTimeout(() => {
                    const first = this.varInputsContainer.querySelector('input');
                    if(first) first.focus();
                }, 100);
            }

            closeVarModal() {
                this.varModal.classList.remove('open');
                this.pendingCopyText = null;
            }

            handleVarSubmit() {
                if (!this.pendingCopyText) return;
                
                const inputs = this.varInputsContainer.querySelectorAll('input');
                const varMap = {};
                inputs.forEach(input => {
                    varMap[input.dataset.varName] = input.value || '';
                });

                // Single-pass replacement using regex callback
                const finalText = this.pendingCopyText.replace(/\{\{(.*?)\}\}/g, (match, varName) => {
                    return varMap.hasOwnProperty(varName) ? varMap[varName] : match;
                });

                navigator.clipboard.writeText(finalText);
                this.closeVarModal();
                this.showToast("Copied with variables!");
            }

            deletePrompt(id) {
                if (confirm('Delete this prompt?')) {
                    this.promptManager.delete(id);
                    this.renderPrompts();
                    this.renderCategories();
                }
            }

            toggleExpand(btn, id) {
                const body = document.getElementById(`card-body-${id}`);
                if (body) {
                    body.classList.toggle('expanded');
                    const isExpanded = body.classList.contains('expanded');
                    btn.textContent = isExpanded ? 'Collapse' : 'Expand';
                }
            }

            handleTagInput() {
                this.renderTagPreview();
                this.renderTagSuggestions();
            }

            renderTagPreview() {
                const tags = this.modalCategory.value.split(',').map(t => t.trim()).filter(Boolean);
                this.tagPreview.innerHTML = tags.map(tag => `<span class="tag-chip">${this.escapeHtml(tag)}</span>`).join('');
            }

            renderTagSuggestions() {
                const currentTags = this.modalCategory.value.split(',').map(t => t.trim()).filter(Boolean);
                const allCats = this.promptManager.getCategories();
                
                const suggestions = allCats.filter(cat => !currentTags.includes(cat));

                this.tagSuggestions.innerHTML = suggestions.map(tag => {
                    return `<span class="tag-suggestion-item" onclick="window.addTag('${tag.replace(/'/g, "\\'")}')">${this.escapeHtml(tag)}</span>`;
                }).join('');
            }

            addTag(tag) {
                const current = this.modalCategory.value.trim();
                if (current && !current.endsWith(',')) {
                    this.modalCategory.value += ', ';
                }
                this.modalCategory.value += tag + ', ';
                this.handleTagInput();
                this.modalCategory.focus();
            }

            // Modal
            openModal(id = null) {
                this.editingId = id;
                if (id) {
                    const p = this.promptManager.get(id);
                    if (p) {
                        this.modalName.value = p.name;
                        this.modalCategory.value = p.category || '';
                        this.modalContent.value = p.content;
                    }
                } else {
                    this.modalName.value = '';
                    this.modalCategory.value = '';
                    this.modalContent.value = '';
                }
                this.handleTagInput();
                this.modal.classList.add('open');
            }

            closeModal() {
                this.modal.classList.remove('open');
            }

            handleSaveModal() {
                const name = this.modalName.value.trim();
                const category = this.modalCategory.value.trim();
                const content = this.modalContent.value.trim();

                if (!name || !content) return alert('Name and Content required');

                const data = { name, category, content };

                if (this.editingId) {
                    this.promptManager.update(this.editingId, data);
                } else {
                    this.promptManager.add(data);
                }

                this.renderPrompts();
                this.renderCategories();
                this.closeModal();
            }

            // Category Manager
            openCatManager() {
                const list = document.getElementById('catManagerList');
                list.innerHTML = '';
                const categories = Array.from(this.promptManager.getCategories()).sort();

                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'category-btn'; // Reuse style
                    btn.textContent = cat;
                    btn.style.border = '1px solid var(--border-color)';
                    btn.onclick = () => {
                        const newName = prompt("Rename category:", cat);
                        if (newName && newName.trim() !== "" && newName !== cat) {
                            this.promptManager.renameCategory(cat, newName.trim());
                            this.renderPrompts();
                            this.renderCategories();
                            this.openCatManager(); // Refresh list
                            this.showToast("Category Renamed");
                        }
                    };
                    list.appendChild(btn);
                });

                document.getElementById('catModal').classList.add('open');
            }

            // Import/Export
            exportPrompts() {
                const prompts = this.promptManager.getAll();
                if (prompts.length === 0) return this.showToast("Nothing to export");
                
                const exportData = {
                    version: 1,
                    timestamp: new Date().toISOString(),
                    prompts: prompts
                };

                const content = JSON.stringify(exportData, null, 2);
                const blob = new Blob([content], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `prompts_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast("Exported JSON");
            }

            importPrompts(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        let imported = [];
                        
                        if (Array.isArray(json)) {
                            imported = json;
                        } else if (json.prompts && Array.isArray(json.prompts)) {
                            imported = json.prompts;
                        } else {
                            throw new Error("Invalid format: Root must be array or versioned object");
                        }
                        
                        let importedCount = 0;
                        let skippedCount = 0;

                        imported.forEach(p => {
                            if (p.name && typeof p.name === 'string' && 
                                p.content && typeof p.content === 'string') {
                                
                                // Validation
                                if (p.content.length > 100000) {
                                    console.warn(`Skipping prompt "${p.name}" - Content exceeds 100k characters.`);
                                    return;
                                }

                                // Sanitize: Create clean object
                                const newPromptData = {
                                    name: p.name.substring(0, 200), // Limit name length
                                    category: (p.category && typeof p.category === 'string') ? p.category.substring(0, 500) : '',
                                    content: p.content
                                };

                                // Check for duplicates against LIVE list
                                // This prevents adding if name AND content match exactly
                                const isDuplicate = this.promptManager.getAll().some(existing => 
                                    existing.name === newPromptData.name && 
                                    existing.content === newPromptData.content
                                );

                                if (isDuplicate) {
                                    skippedCount++;
                                    return;
                                }
                                
                                this.promptManager.add(newPromptData);
                                importedCount++;
                            }
                        });

                        this.renderPrompts();
                        this.renderCategories();
                        
                        let msg = `Imported ${importedCount} prompts`;
                        if (skippedCount > 0) msg += `, Skipped ${skippedCount} duplicates`;
                        this.showToast(msg);
                    } catch (err) {
                        alert("Invalid JSON file: " + err.message);
                    }
                    document.getElementById('importInput').value = '';
                };
                reader.readAsText(file);
            }

            // Utilities
            showToast(msg = 'Copied!') {
                this.toast.textContent = msg;
                this.toast.classList.add('show');
                setTimeout(() => this.toast.classList.remove('show'), 2000);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize App
        const promptManager = new PromptManager();
        const uiManager = new UIManager(promptManager);
        uiManager.init();
    </script>
</body>
