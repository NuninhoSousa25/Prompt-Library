<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Dashboard (Exp)</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --card-bg: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --accent-color: #4a9eff;
            --accent-hover: #357abd;
            --danger-color: #cf6679;
        }

        body.light-mode {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #121212;
            --text-secondary: #555555;
            --border-color: #e0e0e0;
            --accent-color: #007bff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            /* App-like feel */
            display: flex;
        }

        /* --- Left Sidebar (Nav & Filters) --- */
        .sidebar-left {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-size: 0.9rem;
        }

        .category-btn:hover,
        .category-btn.active {
            background-color: rgba(74, 158, 255, 0.15);
            color: var(--accent-color);
        }

        /* Category Tree Styles */
        .category-node {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 2px;
        }

        .category-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.7rem;
            transition: transform 0.2s;
            background: none;
            border: none;
            padding: 0;
        }

        .category-toggle:hover {
            color: var(--text-primary);
        }

        .category-toggle.rotated {
            transform: rotate(90deg);
        }

        .category-toggle.invisible {
            visibility: hidden;
        }

        .category-button {
            flex: 1;
            text-align: left;
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-button:hover,
        .category-button.active {
            background-color: rgba(74, 158, 255, 0.15);
            color: var(--accent-color);
        }

        .category-sub-list {
            list-style: none;
            padding-left: 1.25rem;
            display: none;
            flex-direction: column;
            gap: 2px;
        }

        .category-sub-list.open {
            display: flex;
        }

        .category-node.drag-over {
            background-color: rgba(74, 158, 255, 0.25);
            outline: 1px dashed var(--accent-color);
            border-radius: 4px;
        }

        .category-node.drag-over-top {
            border-top: 2px solid var(--accent-color);
        }

        .category-node.drag-over-bottom {
            border-bottom: 2px solid var(--accent-color);
        }

        .category-list.drag-over {
            background-color: rgba(255, 255, 255, 0.05);
            outline: 1px dashed var(--text-secondary);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5) inset;
        }

        .bottom-actions {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        /* --- Center Stage (Feed) --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            /* Fix flex overflow */
        }

        .top-bar {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            justify-content: space-between;
            background-color: var(--bg-color);
        }

        .search-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
            width: 300px;
            font-size: 0.9rem;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .prompt-grid {
            columns: 3;
            column-gap: 1.25rem;
        }

        .prompt-grid .prompt-card {
            break-inside: avoid;
            margin-bottom: 1.25rem;
            display: inline-block;
            width: 100%;
        }

        @media (max-width: 1200px) { .prompt-grid { columns: 2; } }
        @media (max-width: 700px)  { .prompt-grid { columns: 1; } }

        /* Card Styles */
        .prompt-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.1rem 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .prompt-card:hover {
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
            border-color: #484848;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            margin-bottom: 0.4rem;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .card-category {
            font-size: 0.7rem;
            background-color: rgba(74, 158, 255, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(74, 158, 255, 0.25);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            display: inline-block;
            cursor: pointer;
            transition: background 0.15s;
        }

        .card-category:hover {
            background-color: rgba(74, 158, 255, 0.2);
        }

        /* Expand/collapse system */
        .card-body-wrapper {
            position: relative;
            margin-bottom: 0.75rem;
            flex: 1;
        }

        .card-body {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
            overflow: hidden;
            max-height: 130px;
            transition: max-height 0.3s ease;
        }

        .card-body.expanded {
            max-height: 9999px;
        }

        .card-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: linear-gradient(transparent, var(--card-bg));
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .card-fade.hidden {
            opacity: 0;
        }

        .expand-btn {
            display: block;
            width: 100%;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 0.3rem;
            cursor: pointer;
            text-align: center;
            margin-bottom: 0.6rem;
            transition: background 0.15s, color 0.15s;
            letter-spacing: 0.03em;
        }

        .expand-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        /* Markdown Styles */
        .card-body h1, .card-body h2, .card-body h3 {
            color: var(--text-primary);
            font-weight: 600;
            margin: 0.8rem 0 0.3rem;
            line-height: 1.3;
        }
        .card-body h1 { font-size: 1rem; }
        .card-body h2 { font-size: 0.92rem; letter-spacing: 0.02em; }
        .card-body h3 { font-size: 0.87rem; }

        .card-body p {
            margin: 0.4rem 0;
        }

        .card-body hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 0.6rem 0;
        }

        .card-body ul, .card-body ol {
            padding-left: 1.2rem;
            margin: 0.3rem 0;
        }

        .card-body li {
            margin: 0.15rem 0;
        }

        .card-body pre {
            background-color: #1a1a1a;
            padding: 2rem 0.8rem 0.8rem 0.8rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0.5rem 0;
            border: 1px solid var(--border-color);
        }
        
        .code-block-wrapper {
            position: relative;
            margin: 0.5rem 0;
        }

        .copy-code-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: 0.2s;
        }
        
        .copy-code-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .card-body code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85em;
            background-color: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            color: #dcdcaa;
        }

        .card-body pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        .card-body strong {
            color: var(--text-primary);
            font-weight: 650;
        }

        .card-body em {
            color: var(--text-primary);
            font-style: italic;
        }
        
        mark {
            background: rgba(74, 158, 255, 0.3);
            color: white;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* Tag UI */
        .tag-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            min-height: 24px;
        }
        .tag-chip {
            background-color: var(--accent-color);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .tag-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            margin-top: -0.5rem;
            max-height: 100px;
            overflow-y: auto;
        }
        .tag-suggestion-item {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tag-suggestion-item:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background-color: var(--border-color);
            color: white;
        }

        .btn-delete:hover {
            color: var(--danger-color);
        }

        .full-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-copy {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        /* Modal & Toast (Reused) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            width: 800px;
            max-width: 95vw;
            max-height: 95vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        input,
        textarea.form-input {
            width: 100%;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.8rem;
            margin-bottom: 0.75rem;
            border-radius: 4px;
        }

        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        #toast.show {
            opacity: 1;
            bottom: 3rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 3rem;
            font-size: 1.1rem;
        }
        /* Wide modal for editor */
        .modal-wide {
            width: min(1100px, 95vw) !important;
        }

        /* Edit/Split/Preview toggle */
        .preview-toggle-group {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .preview-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 0.35rem 0.85rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-family: inherit;
        }

        .preview-toggle:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }

        .preview-toggle.active,
        .preview-toggle:hover {
            background: rgba(74, 158, 255, 0.15);
            color: var(--accent-color);
        }

        /* Two-pane layout */
        .editor-panes {
            display: flex;
            gap: 0.75rem;
            height: 420px;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pane-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        .editor-textarea {
            flex: 1;
            resize: none;
            min-height: 0;
            margin: 0 !important;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .preview-pane {
            display: none;
        }

        .editor-preview-body {
            flex: 1;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.8rem 1rem;
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Mode states */
        .editor-panes.mode-edit .preview-pane   { display: none; }
        .editor-panes.mode-edit .editor-pane    { display: flex; }

        .editor-panes.mode-preview .editor-pane { display: none; }
        .editor-panes.mode-preview .preview-pane { display: flex; }

        .editor-panes.mode-split .editor-pane   { display: flex; }
        .editor-panes.mode-split .preview-pane  { display: flex; }

    </style>
</head>

<body>

    <!-- Left Sidebar -->
    <aside class="sidebar-left">
        <div class="app-title">⚡ Prompt Lib</div>

        <div class="nav-section">
            <div class="nav-label">Categories</div>
            <ul class="category-list" id="categoryList">
                <li><button class="category-btn active" data-cat="all">All Prompts</button></li>
                <!-- Categories injected here -->
            </ul>
        </div>

        <div class="bottom-actions">
            <button class="category-btn" id="manageCatsBtn">Manage Categories</button>
            <button class="category-btn" id="themeBtn">Toggle Theme</button>
            <button class="category-btn" id="exportBtn">⬇ Export JSON</button>
            <button class="category-btn" id="importBtn">📁 Import File</button>
            <button class="category-btn" id="syncBtn" title="Fetch prompts from remote URL">🔄 Sync from URL</button>
            <button class="category-btn" id="deleteAllBtn" style="color: var(--danger-color);">🗑 Delete All</button>
            <div id="syncStatus" style="font-size:0.75rem; color: var(--text-secondary); padding: 0.25rem 0.75rem; min-height: 1.2rem;"></div>
            <input type="file" id="importInput" accept=".json" style="display: none;">
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search prompts...">
            <div style="display: flex; gap: 0.5rem;">
                <button class="add-btn" id="openAddModalBtn">+ New Prompt</button>
            </div>
        </header>

        <div class="scroll-area">
            <div class="prompt-grid" id="promptGrid">
                <!-- Cards injected here -->
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content modal-wide">
            <!-- Header row -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2 style="margin:0;">Manage Prompt</h2>
                <div class="preview-toggle-group">
                    <button class="preview-toggle active" id="modeEdit" onclick="setEditorMode('edit')">Edit</button>
                    <button class="preview-toggle" id="modeSplit" onclick="setEditorMode('split')">Split</button>
                    <button class="preview-toggle" id="modePreview" onclick="setEditorMode('preview')">Preview</button>
                </div>
            </div>
            <!-- Meta fields -->
            <div style="display:flex; gap:0.75rem; margin-bottom:0.5rem;">
                <input type="text" id="modalName" placeholder="Prompt Name" style="flex:1; margin:0;">
                <input type="text" id="modalCategory" placeholder="Tags (comma separated)" autocomplete="off" style="flex:1; margin:0;">
            </div>
            <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; align-items:flex-start;">
                <div id="tagPreview" class="tag-preview" style="flex:1; margin:0;"></div>
                <div id="tagSuggestions" class="tag-suggestions" style="flex:1; margin:0;"></div>
            </div>
            <!-- Editor / Preview panes -->
            <div class="editor-panes" id="editorPanes">
                <div class="editor-pane" id="editorPane">
                    <div class="pane-label">Markdown</div>
                    <textarea class="form-input editor-textarea" id="modalContent" placeholder="Prompt text… supports **bold**, ## headings, ``` code blocks```"></textarea>
                </div>
                <div class="editor-pane preview-pane" id="previewPane">
                    <div class="pane-label">Preview</div>
                    <div class="editor-preview-body card-body expanded" id="modalPreview"></div>
                </div>
            </div>
            <!-- Footer -->
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top:1rem;">
                <button class="full-btn btn-clear" id="closeModal" style="width: auto; padding: 0.6rem 1.5rem;">Cancel</button>
                <button class="full-btn btn-copy" id="saveModal" style="width: auto; padding: 0.6rem 1.5rem;">Save</button>
            </div>
        </div>
    </div>

    <!-- Category Manager Modal -->
    <div class="modal-overlay" id="catModal">
        <div class="modal-content" style="width: 400px;">
            <h2 style="margin-bottom: 1rem;">Categories</h2>
            <p style="color:var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">Click to rename. (Updates
                all prompts)</p>
            <div id="catManagerList"
                style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;"></div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="full-btn btn-clear" id="closeCatModal" style="width: auto;">Close</button>
            </div>
        </div>
    </div>

    <!-- Sync URL Modal -->
    <div class="modal-overlay" id="syncModal">
        <div class="modal-content" style="width: 500px;">
            <h2 style="margin-bottom: 0.5rem;">🔄 Sync from URL</h2>
            <p style="color:var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.25rem;">
                Fetches a <code style="font-size:0.8rem; background:rgba(255,255,255,0.08); padding:1px 5px; border-radius:3px;">prompts_backup.json</code> from the URL below and merges new prompts in. Existing local prompts are never deleted.
            </p>
            <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:0.4rem;">Remote JSON URL</label>
            <input type="url" id="syncUrlInput" placeholder="https://example.com/prompts_backup.json" style="margin-bottom:1rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
                <input type="checkbox" id="syncOnLoad" style="width:auto; margin:0; accent-color: var(--accent-color);">
                <label for="syncOnLoad" style="font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">Auto-sync on page load</label>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="full-btn btn-clear" id="closeSyncModal" style="width: auto; padding: 0.6rem 1.5rem;">Cancel</button>
                <button class="full-btn btn-copy" id="confirmSync" style="width: auto; padding: 0.6rem 1.5rem;">Sync Now</button>
            </div>
        </div>
    </div>

    <!-- Variable Input Modal -->
    <div class="modal-overlay" id="varModal">
        <div class="modal-content" style="width: 400px;">
            <h2 style="margin-bottom: 1rem;">Enter Variables</h2>
            <div id="varModalInputs" style="max-height: 300px; overflow-y: auto;"></div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="full-btn btn-clear" id="closeVarModal" style="width: auto;">Cancel</button>
                <button class="full-btn btn-copy" id="confirmVarModal" style="width: auto;">Copy</button>
            </div>
        </div>
    </div>

    <div id="toast">Copied!</div>

    <script>
        // --- Data Layer ---
        const DEFAULT_SYNC_URL = 'https://nuno-sousa.com/repository/uploads/prompts_backup.json';

        class PromptManager {
            constructor() {
                this.prompts = JSON.parse(localStorage.getItem('prompts')) || [];
                // Load category order, or init empty
                this.categoryOrder = JSON.parse(localStorage.getItem('categoryOrder')) || [];
                this.syncUrl = localStorage.getItem('syncUrl') || DEFAULT_SYNC_URL;
                this.syncOnLoad = localStorage.getItem('syncOnLoad') === 'true';
                this.migrate();
            }

            saveSyncSettings(url, onLoad) {
                this.syncUrl = url;
                this.syncOnLoad = onLoad;
                localStorage.setItem('syncUrl', url);
                localStorage.setItem('syncOnLoad', onLoad ? 'true' : 'false');
            }

            async fetchFromUrl(url) {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                let incoming = [];
                if (Array.isArray(json)) {
                    incoming = json;
                } else if (json.prompts && Array.isArray(json.prompts)) {
                    incoming = json.prompts;
                } else {
                    throw new Error('Invalid format: expected array or { prompts: [] }');
                }
                return incoming;
            }

            mergePrompts(incoming) {
                let added = 0, skipped = 0;
                incoming.forEach(p => {
                    if (!p.name || !p.content) return;
                    if (p.content.length > 100000) { skipped++; return; }
                    const isDuplicate = this.prompts.some(e =>
                        e.name === p.name.substring(0, 200) && e.content === p.content
                    );
                    if (isDuplicate) { skipped++; return; }
                    this.add({
                        name: p.name.substring(0, 200),
                        category: (p.category && typeof p.category === 'string') ? p.category.substring(0, 500) : '',
                        content: p.content
                    });
                    added++;
                });
                return { added, skipped };
            }

            migrate() {
                let changed = false;
                this.prompts.forEach(p => {
                    if (!p.id) {
                        p.id = this.generateId();
                        changed = true;
                    }
                });
                
                // Cleanup categories on load/migrate
                const activeCats = this.getActiveCategories();
                this.cleanupCategoryOrder(activeCats);
                
                if (changed) this.save();
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            getAll() {
                return this.prompts;
            }

            get(id) {
                return this.prompts.find(p => p.id === id);
            }

            add(prompt) {
                prompt.id = this.generateId();
                this.prompts.unshift(prompt);
                this.save();
            }

            update(id, data) {
                const index = this.prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.prompts[index] = { ...this.prompts[index], ...data };
                    this.save();
                    // Cleanup after potential category change
                    this.cleanupCategoryOrder(this.getActiveCategories());
                }
            }

            delete(id) {
                const index = this.prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.prompts.splice(index, 1);
                    this.save();
                    // Cleanup after deletion
                    this.cleanupCategoryOrder(this.getActiveCategories());
                }
            }

            save() {
                localStorage.setItem('prompts', JSON.stringify(this.prompts));
            }

            saveOrder() {
                localStorage.setItem('categoryOrder', JSON.stringify(this.categoryOrder));
            }

            cleanupCategoryOrder(activeCategories) {
                const activeSet = new Set(activeCategories);
                const newOrder = this.categoryOrder.filter(cat => activeSet.has(cat));
                
                if (newOrder.length !== this.categoryOrder.length) {
                    this.categoryOrder = newOrder;
                    this.saveOrder();
                }
            }
            
            // Helper to get raw active category list
            getActiveCategories() {
                const tags = new Set();
                this.prompts.forEach(p => {
                    if (p.category) {
                        p.category.split(',').map(tag => tag.trim()).filter(Boolean).forEach(tag => tags.add(tag));
                    }
                });
                return Array.from(tags);
            }

            getCategories() {
                const catArray = this.getActiveCategories();

                // Sort based on saved order
                catArray.sort((a, b) => {
                    const idxA = this.categoryOrder.indexOf(a);
                    const idxB = this.categoryOrder.indexOf(b);

                    // If both are in the list, respect order
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    // If only A is in list, A comes first
                    if (idxA !== -1) return -1;
                    // If only B is in list, B comes first
                    if (idxB !== -1) return 1;
                    // Otherwise sort alphabetically
                    return a.localeCompare(b);
                });

                return catArray;
            }

            reorderCategory(moved, target, position) {
                // Ensure order list handles all current categories
                const currentCats = this.getCategories(); // This returns them partly sorted, partly alpha
                // We need to merge existing order with any new ones found

                const fullOrder = [...this.categoryOrder];
                currentCats.forEach(c => {
                    if (!fullOrder.includes(c)) fullOrder.push(c);
                });

                const movedIdx = fullOrder.indexOf(moved);
                if (movedIdx === -1) return; // Should not happen

                // Remove moved
                fullOrder.splice(movedIdx, 1);

                // Find target index
                let targetIdx = fullOrder.indexOf(target);
                if (targetIdx === -1) {
                    // Fallback append
                    fullOrder.push(moved);
                } else {
                    if (position === 'after') targetIdx++;
                    fullOrder.splice(targetIdx, 0, moved);
                }

                this.categoryOrder = fullOrder;
                this.saveOrder();
            }

            renameCategory(oldName, newName) {
                let changed = false;
                this.prompts.forEach(p => {
                    if (p.category) {
                        const tags = p.category.split(',').map(t => t.trim());
                        if (tags.includes(oldName)) {
                            p.category = tags.map(t => t === oldName ? newName : t).join(', ');
                            changed = true;
                        }
                    }
                });
                if (changed) this.save();
                return changed;
            }

            moveCategory(oldPath, newParentPath) {
                const name = oldPath.split('/').pop();
                const newPath = newParentPath ? `${newParentPath}/${name}` : name;

                // Prevent moving into self or children
                if (newParentPath && (newParentPath === oldPath || newParentPath.startsWith(oldPath + '/'))) {
                    return false;
                }

                let changed = false;
                this.prompts.forEach(p => {
                    if (p.category) {
                        const tags = p.category.split(',').map(t => t.trim());
                        const newTags = tags.map(tag => {
                            if (tag === oldPath || tag.startsWith(oldPath + '/')) {
                                changed = true;
                                return newPath + tag.substring(oldPath.length);
                            }
                            return tag;
                        });
                        p.category = newTags.join(', ');
                    }
                });

                if (changed) this.save();
                return changed;
            }
        }

        // --- UI Layer ---
        class UIManager {
            constructor(promptManager) {
                this.promptManager = promptManager;
                this.activeCategory = 'all';
                this.searchTerm = '';

                // Elements
                this.grid = document.getElementById('promptGrid');
                this.catList = document.getElementById('categoryList');
                this.modal = document.getElementById('modal');
                this.toast = document.getElementById('toast');

                // Modal Inputs
                this.modalName = document.getElementById('modalName');
                this.modalCategory = document.getElementById('modalCategory');
                this.tagPreview = document.getElementById('tagPreview');
                this.tagSuggestions = document.getElementById('tagSuggestions');
                this.modalContent = document.getElementById('modalContent');

                this.editingId = null;
                
                // Variable Modal
                this.varModal = document.getElementById('varModal');
                this.varInputsContainer = document.getElementById('varModalInputs');
                this.pendingCopyText = null;

                this.initTheme();
                this.bindEvents();
            }

            debounce(func, wait) {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            bindEvents() {
                document.getElementById('openAddModalBtn').addEventListener('click', () => this.openModal());
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                document.getElementById('saveModal').addEventListener('click', () => this.handleSaveModal());
                this.modalCategory.addEventListener('input', () => this.handleTagInput());

                // Live markdown preview
                document.getElementById('modalContent').addEventListener('input', () => {
                    this.updateModalPreview();
                });

                // Mode switcher exposed globally for inline onclick
                window.setEditorMode = (mode) => this.setEditorMode(mode);

                // Cat Manager
                document.getElementById('manageCatsBtn').addEventListener('click', () => this.openCatManager());
                document.getElementById('closeCatModal').addEventListener('click', () => document.getElementById('catModal').classList.remove('open'));

                // Theme
                document.getElementById('themeBtn').addEventListener('click', () => this.toggleTheme());

                // Variable Modal
                document.getElementById('closeVarModal').addEventListener('click', () => this.closeVarModal());
                document.getElementById('confirmVarModal').addEventListener('click', () => this.handleVarSubmit());

                document.getElementById('searchInput').addEventListener('input', this.debounce((e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.renderPrompts();
                }, 250));

                document.getElementById('exportBtn').addEventListener('click', () => this.exportPrompts());
                document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());
                document.getElementById('importInput').addEventListener('change', (e) => this.importPrompts(e));

                // Sync modal
                document.getElementById('syncBtn').addEventListener('click', () => this.openSyncModal());
                document.getElementById('closeSyncModal').addEventListener('click', () => document.getElementById('syncModal').classList.remove('open'));
                document.getElementById('confirmSync').addEventListener('click', () => this.handleSync());

                // Delete All
                document.getElementById('deleteAllBtn').addEventListener('click', () => this.deleteAll());

                // Global access for onclick handlers in HTML (legacy support for inline onclicks)
                window.setCategory = (cat) => this.setCategory(cat);
                window.deletePrompt = (id) => this.deletePrompt(id);
                window.copyPrompt = (id) => this.copyPrompt(id);
                window.downloadPrompt = (id) => this.downloadPrompt(id);
                window.copyText = (text) => this.copyText(text);
                window.openEdit = (id) => this.openModal(id);
                window.toggleExpand = (btn, id) => this.toggleExpand(btn, id);
                window.copyCodeBlock = (btn) => this.copyCodeBlock(btn);
                window.addTag = (tag) => this.addTag(tag);
            }

            init() {
                this.renderPrompts();
                this.renderCategories();
                this.autoSync();
            }

            initTheme() {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'light') {
                    document.body.classList.add('light-mode');
                }
            }

            toggleTheme() {
                document.body.classList.toggle('light-mode');
                const theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
                localStorage.setItem('theme', theme);
            }

            setCategory(cat) {
                this.activeCategory = cat;
                this.renderPrompts();
                this.updateActiveCategoryUI();
            }

            updateActiveCategoryUI() {
                // Remove active class from all
                document.querySelectorAll('.category-button, .category-btn').forEach(b => b.classList.remove('active'));

                // Add to current
                if (this.activeCategory === 'all') {
                    const allBtn = document.getElementById('cat-btn-all');
                    if (allBtn) allBtn.classList.add('active');
                } else {
                    // Match by data-cat attribute
                    const btn = document.querySelector(`.category-button[data-cat="${this.activeCategory.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"]`);
                    if (btn) btn.classList.add('active');
                }
            }

            // Build Tree: { name: 'A', fullPath: 'A', children: { 'B': { name: 'B', fullPath: 'A/B', children: {} } } }
            buildTree(tags) {
                const tree = {};
                tags.forEach(tag => {
                    const parts = tag.split('/');
                    let currentLevel = tree;
                    let currentPath = '';

                    parts.forEach((part, index) => {
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        if (!currentLevel[part]) {
                            currentLevel[part] = {
                                name: part,
                                fullPath: currentPath,
                                children: {}
                            };
                        }
                        currentLevel = currentLevel[part].children;
                    });
                });
                return tree;
            }

            renderCategories() {
                const categories = this.promptManager.getCategories(); // Now returns sorted array
                // buildTree needs to respect array order
                const tree = this.buildTree(categories);

                this.catList.innerHTML = '';

                // "All Prompts" special item
                const allLi = document.createElement('li');
                allLi.innerHTML = `
                    <div class="category-node" id="cat-root-dropzone">
                        <span class="category-toggle invisible">▶</span>
                        <button id="cat-btn-all" class="category-button ${this.activeCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">All Prompts</button>
                    </div>`;
                this.catList.appendChild(allLi);

                // Enable drop on Root
                const rootZone = allLi.querySelector('.category-node');
                this.setupDropZone(rootZone, null);

                this.renderTreeLevel(tree, this.catList);

                // Allow dropping on the empty list area to move to root
                this.setupDropZone(this.catList, null);
            }

            setupDropZone(element, path) {
                element.ondragover = (e) => this.handleDragOver(e, element, path);
                element.ondragleave = (e) => this.handleDragLeave(e, element);
                element.ondrop = (e) => this.handleDrop(e, element, path);
            }

            handleDragOver(e, element, path) {
                e.preventDefault();
                e.stopPropagation();

                if (element === this.catList) {
                    element.classList.add('drag-over');
                    return;
                }

                const rect = element.getBoundingClientRect();
                const relY = e.clientY - rect.top;
                const height = rect.height;

                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');

                if (path === null) {
                    // Root (All Prompts) only supports nesting (moving to root)
                    element.classList.add('drag-over');
                    return;
                }

                // Logic: Top 25% = before, Bottom 25% = after, Middle = nest
                if (relY < height * 0.25) {
                    element.classList.add('drag-over-top');
                    element.dataset.dropAction = 'before';
                } else if (relY > height * 0.75) {
                    element.classList.add('drag-over-bottom');
                    element.dataset.dropAction = 'after';
                } else {
                    element.classList.add('drag-over');
                    element.dataset.dropAction = 'inside';
                }
            }

            handleDragLeave(e, element) {
                e.stopPropagation();
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
            }

            handleDrop(e, element, path) {
                e.preventDefault();
                e.stopPropagation();
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');

                const oldPath = e.dataTransfer.getData("text/plain");
                if (!oldPath) return;

                // Moving to Empty Space -> To Root
                if (element === this.catList || path === null) {
                    if (this.promptManager.moveCategory(oldPath, null)) {
                        this.refreshUI();
                        this.showToast("Moved to Top Level");
                    }
                    return;
                }

                const action = element.dataset.dropAction;

                if (action === 'inside') {
                    if (this.promptManager.moveCategory(oldPath, path)) {
                        this.refreshUI();
                        this.showToast("Nested Category");
                    }
                } else if (action === 'before' || action === 'after') {
                    this.promptManager.reorderCategory(oldPath, path, action);
                    this.refreshUI();
                    this.showToast("Reordered Category");
                }
            }

            refreshUI() {
                this.renderPrompts();
                this.renderCategories();
            }

            renderTreeLevel(nodes, container) {
                // Object.keys is arbitrary order, we must use the sorted order from promptManager
                // BUT buildTree returns a generic object.
                // We need to iterate our sorted categories list and pick out nodes that belong to this level.

                // Better approach: buildTree already iterated the sorted list?
                // Actually, buildTree returns an object. Object traversal order is not guaranteed to receive sorted keys? 
                // Actually in modern JS it is insertion order for strings. 
                // But PromptManager.getCategories returns FULL paths.

                // Updated Strategy: We will iterate the `nodes` object's keys, 
                // but we need to sort THEM based on our global sort order?
                // That's tricky because global order is full paths (A, B, A/C).

                // Simplify: Just sort the keys of 'nodes' based on their index in the global list if possible, or just alphabetical if not found?
                // Actually the node has `fullPath`. We can use that.

                const sortedKeys = Object.keys(nodes).sort((a, b) => {
                    // Compare nodes[a].fullPath vs nodes[b].fullPath using manager's logic
                    const pathA = nodes[a].fullPath;
                    const pathB = nodes[b].fullPath;
                    const allCats = this.promptManager.getCategories(); // This is the sorted array
                    return allCats.indexOf(pathA) - allCats.indexOf(pathB);
                });

                sortedKeys.forEach(key => {
                    const node = nodes[key];
                    const hasChildren = Object.keys(node.children).length > 0;

                    const li = document.createElement('li');

                    // Header
                    const row = document.createElement('div');
                    row.className = 'category-node';
                    row.draggable = true;

                    // Drag Start
                    row.ondragstart = (e) => {
                        e.dataTransfer.setData("text/plain", node.fullPath);
                        e.stopPropagation(); // Prevent bubbling
                    };

                    // Drop Zone
                    this.setupDropZone(row, node.fullPath);

                    const toggle = document.createElement('button');
                    toggle.className = `category-toggle ${hasChildren ? '' : 'invisible'}`;
                    toggle.textContent = '▶';
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.onclick = (e) => {
                        e.stopPropagation();
                        this.toggleSubMenu(toggle, subList);
                    };

                    const btn = document.createElement('button');
                    btn.className = `category-button ${this.activeCategory === node.fullPath ? 'active' : ''}`;
                    btn.textContent = node.name;
                    btn.dataset.cat = node.fullPath;
                    btn.onclick = () => this.setCategory(node.fullPath);

                    row.appendChild(toggle);
                    row.appendChild(btn);
                    li.appendChild(row);

                    // Children
                    const subList = document.createElement('ul');
                    subList.className = 'category-sub-list';

                    if (hasChildren) {
                        this.renderTreeLevel(node.children, subList);
                    }

                    li.appendChild(subList);
                    container.appendChild(li);
                });
            }

            toggleSubMenu(toggle, list) {
                const isOpen = list.classList.toggle('open');
                toggle.classList.toggle('rotated');
                toggle.setAttribute('aria-expanded', isOpen);
            }

            parseMarkdown(text) {
                if (!text) return '';

                // 1. Extract and protect code blocks before any other processing
                const codeBlocks = [];
                text = text.replace(/```([\w]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                    const escaped = code
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const idx = codeBlocks.length;
                    codeBlocks.push(`<div class="code-block-wrapper"><button class="copy-code-btn" onclick="copyCodeBlock(this)">Copy</button><pre><code>${escaped}</code></pre></div>`);
                    return `\x00CODE${idx}\x00`;
                });

                // 2. Escape HTML in remaining text
                text = text
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

                // 3. Process line by line
                const lines = text.split('\n');
                const output = [];
                let i = 0;

                while (i < lines.length) {
                    const line = lines[i];

                    // Headings
                    if (/^### (.+)/.test(line)) { output.push(`<h3>${line.replace(/^### /, '')}</h3>`); i++; continue; }
                    if (/^## (.+)/.test(line))  { output.push(`<h2>${line.replace(/^## /, '')}</h2>`); i++; continue; }
                    if (/^# (.+)/.test(line))   { output.push(`<h1>${line.replace(/^# /, '')}</h1>`); i++; continue; }

                    // Horizontal rule: ---, ***, ===
                    if (/^(-{3,}|\*{3,}|={3,})$/.test(line.trim())) { output.push('<hr>'); i++; continue; }

                    // Code block placeholders
                    if (/^\x00CODE\d+\x00$/.test(line.trim())) {
                        const idx = parseInt(line.match(/\x00CODE(\d+)\x00/)[1]);
                        output.push(codeBlocks[idx]);
                        i++; continue;
                    }

                    // Unordered list
                    if (/^[\*\-] (.+)/.test(line)) {
                        const items = [];
                        while (i < lines.length && /^[\*\-] (.+)/.test(lines[i])) {
                            items.push(`<li>${lines[i].replace(/^[\*\-] /, '')}</li>`);
                            i++;
                        }
                        output.push(`<ul>${items.join('')}</ul>`);
                        continue;
                    }

                    // Ordered list
                    if (/^\d+\. (.+)/.test(line)) {
                        const items = [];
                        while (i < lines.length && /^\d+\. (.+)/.test(lines[i])) {
                            items.push(`<li>${lines[i].replace(/^\d+\. /, '')}</li>`);
                            i++;
                        }
                        output.push(`<ol>${items.join('')}</ol>`);
                        continue;
                    }

                    // Empty line → paragraph break
                    if (line.trim() === '') { output.push('<br>'); i++; continue; }

                    // Regular paragraph line
                    output.push(`<p>${line}</p>`);
                    i++;
                }

                // 4. Inline formatting on the assembled HTML
                let html = output.join('');

                // Restore code block placeholders that were inside paragraphs
                codeBlocks.forEach((block, idx) => {
                    html = html.replace(new RegExp(`\x00CODE${idx}\x00`, 'g'), block);
                });

                // Inline code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                // Bold
                html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
                // Italic (only _ to avoid clashing with *)
                html = html.replace(/_([^_\n]+)_/g, '<em>$1</em>');

                return html;
            }

            highlightText(text, terms) {
                let safe = this.escapeHtml(text);
                if (!terms || terms.length === 0) return safe;
                
                const safeTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                const pattern = new RegExp(`(${safeTerms.join('|')})`, 'gi');
                return safe.replace(pattern, '<mark>$1</mark>');
            }

            renderPrompts() {
                const prompts = this.promptManager.getAll();
                const fragment = document.createDocumentFragment();
                const searchTokens = this.searchTerm.toLowerCase().split(/\s+/).filter(Boolean);

                // Filter
                const filtered = prompts.filter(p => {
                    const pTags = p.category ? p.category.split(',').map(t => t.trim()) : [];

                    // Match: Exact match OR Path match (e.g. "Work" matches "Work/Project")
                    const matchesCat = this.activeCategory === 'all' || pTags.some(tag =>
                        tag === this.activeCategory || tag.startsWith(this.activeCategory + '/')
                    );

                    const nameLower = p.name.toLowerCase();
                    const contentLower = p.content.toLowerCase();
                    
                    const matchesSearch = searchTokens.length === 0 || searchTokens.every(token => 
                        nameLower.includes(token) || contentLower.includes(token)
                    );

                    return matchesCat && matchesSearch;
                });

                if (filtered.length === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    emptyState.textContent = 'No prompts found.';
                    this.grid.innerHTML = '';
                    this.grid.appendChild(emptyState);
                    return;
                }

                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'prompt-card';
                    const isLong = p.content.length > 300;

                    // Tags: strip sub-path, show only leaf name with full path as title
                    const tagsHtml = p.category
                        ? p.category.split(',').map(tag => {
                            const trimmed = tag.trim();
                            const leaf = trimmed.split('/').pop();
                            return `<span class="card-category" title="${this.escapeHtml(trimmed)}" onclick="setCategory('${trimmed.replace(/'/g,"\\'")}')">
                                ${this.escapeHtml(leaf)}
                            </span>`;
                          }).join('')
                        : '';

                    const contentHtml = this.parseMarkdown(p.content);
                    const titleHtml = this.highlightText(p.name, searchTokens);

                    card.innerHTML = `
                        <div class="card-header">
                            <div style="min-width:0">
                                <div class="card-title">${titleHtml}</div>
                                <div class="card-tags">${tagsHtml}</div>
                            </div>
                        </div>
                        <div class="card-body-wrapper">
                            <div class="card-body" id="card-body-${p.id}">${contentHtml}</div>
                            ${isLong ? `<div class="card-fade" id="card-fade-${p.id}"></div>` : ''}
                        </div>
                        ${isLong ? `<button class="expand-btn" id="expand-btn-${p.id}" onclick="toggleExpand(this, '${p.id}')">▾ Show more</button>` : ''}
                        <div class="card-actions">
                            <button class="action-btn" aria-label="Copy Prompt" onclick="copyPrompt('${p.id}')">Copy</button>
                            <button class="action-btn" aria-label="Download" title="Download as .md" onclick="downloadPrompt('${p.id}')">⬇</button>
                            <button class="action-btn" aria-label="Edit Prompt" onclick="openEdit('${p.id}')">Edit</button>
                            <button class="action-btn btn-delete" aria-label="Delete Prompt" onclick="deletePrompt('${p.id}')">Del</button>
                        </div>
                    `;
                    fragment.appendChild(card);
                });

                this.grid.innerHTML = '';
                this.grid.appendChild(fragment);
            }

            copyPrompt(id) {
                const prompt = this.promptManager.get(id);
                if (prompt) {
                    this.copyText(prompt.content);
                }
            }

            downloadPrompt(id) {
                const p = this.promptManager.get(id);
                if (!p) return;
                const blob = new Blob([p.content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${p.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                a.click();
                URL.revokeObjectURL(url);
            }

            copyText(text) {
                // Regex to find text inside {{ double curly braces }}
                const variables = [...text.matchAll(/\{\{(.*?)\}\}/g)];

                if (variables.length > 0) {
                    this.openVarModal(text, variables);
                } else {
                    navigator.clipboard.writeText(text);
                    this.showToast("Copied!");
                }
            }

            copyCodeBlock(btn) {
                const pre = btn.nextElementSibling;
                if (pre) {
                    navigator.clipboard.writeText(pre.innerText);
                    const original = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = original, 2000);
                }
            }

            openVarModal(text, variables) {
                this.pendingCopyText = text;
                this.varInputsContainer.innerHTML = '';
                
                // Deduplicate variables
                const uniqueVars = [...new Set(variables.map(m => m[1]))];

                uniqueVars.forEach(v => {
                    const label = document.createElement('label');
                    label.style.display = 'block';
                    label.style.marginBottom = '0.5rem';
                    label.style.color = 'var(--text-secondary)';
                    label.style.fontSize = '0.9rem';
                    label.textContent = v;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.dataset.varName = v;
                    input.placeholder = `Value for ${v}`;
                    
                    this.varInputsContainer.appendChild(label);
                    this.varInputsContainer.appendChild(input);
                });

                this.varModal.classList.add('open');
                // Focus first input
                setTimeout(() => {
                    const first = this.varInputsContainer.querySelector('input');
                    if(first) first.focus();
                }, 100);
            }

            closeVarModal() {
                this.varModal.classList.remove('open');
                this.pendingCopyText = null;
            }

            handleVarSubmit() {
                if (!this.pendingCopyText) return;
                
                const inputs = this.varInputsContainer.querySelectorAll('input');
                const varMap = {};
                inputs.forEach(input => {
                    varMap[input.dataset.varName] = input.value || '';
                });

                // Single-pass replacement using regex callback
                const finalText = this.pendingCopyText.replace(/\{\{(.*?)\}\}/g, (match, varName) => {
                    return varMap.hasOwnProperty(varName) ? varMap[varName] : match;
                });

                navigator.clipboard.writeText(finalText);
                this.closeVarModal();
                this.showToast("Copied with variables!");
            }

            deletePrompt(id) {
                if (confirm('Delete this prompt?')) {
                    this.promptManager.delete(id);
                    this.renderPrompts();
                    this.renderCategories();
                }
            }

            deleteAll() {
                const count = this.promptManager.getAll().length;
                if (count === 0) return this.showToast('No prompts to delete');
                if (confirm(`Delete all ${count} prompt${count !== 1 ? 's' : ''}? This cannot be undone.`)) {
                    this.promptManager.prompts = [];
                    this.promptManager.categoryOrder = [];
                    this.promptManager.save();
                    this.promptManager.saveOrder();
                    this.activeCategory = 'all';
                    this.renderPrompts();
                    this.renderCategories();
                    this.showToast('All prompts deleted');
                }
            }

            toggleExpand(btn, id) {
                const body = document.getElementById(`card-body-${id}`);
                const fade = document.getElementById(`card-fade-${id}`);
                if (!body) return;
                const isExpanded = body.classList.toggle('expanded');
                if (fade) fade.classList.toggle('hidden', isExpanded);
                btn.textContent = isExpanded ? '▴ Show less' : '▾ Show more';
            }

            handleTagInput() {
                this.renderTagPreview();
                this.renderTagSuggestions();
            }

            renderTagPreview() {
                const tags = this.modalCategory.value.split(',').map(t => t.trim()).filter(Boolean);
                this.tagPreview.innerHTML = tags.map(tag => `<span class="tag-chip">${this.escapeHtml(tag)}</span>`).join('');
            }

            renderTagSuggestions() {
                const currentTags = this.modalCategory.value.split(',').map(t => t.trim()).filter(Boolean);
                const allCats = this.promptManager.getCategories();
                
                const suggestions = allCats.filter(cat => !currentTags.includes(cat));

                this.tagSuggestions.innerHTML = suggestions.map(tag => {
                    return `<span class="tag-suggestion-item" onclick="window.addTag('${tag.replace(/'/g, "\\'")}')">${this.escapeHtml(tag)}</span>`;
                }).join('');
            }

            addTag(tag) {
                const current = this.modalCategory.value.trim();
                if (current && !current.endsWith(',')) {
                    this.modalCategory.value += ', ';
                }
                this.modalCategory.value += tag + ', ';
                this.handleTagInput();
                this.modalCategory.focus();
            }

            setEditorMode(mode) {
                const panes = document.getElementById('editorPanes');
                panes.className = `editor-panes mode-${mode}`;
                document.querySelectorAll('.preview-toggle').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById(`mode${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
                if (btn) btn.classList.add('active');
                if (mode !== 'edit') this.updateModalPreview();
            }

            updateModalPreview() {
                const preview = document.getElementById('modalPreview');
                if (!preview) return;
                const text = document.getElementById('modalContent').value;
                preview.innerHTML = this.parseMarkdown(text) || '<span style="opacity:0.4;font-style:italic;">Nothing to preview yet…</span>';
            }

            // Modal
            openModal(id = null) {
                this.editingId = id;
                if (id) {
                    const p = this.promptManager.get(id);
                    if (p) {
                        this.modalName.value = p.name;
                        this.modalCategory.value = p.category || '';
                        this.modalContent.value = p.content;
                    }
                } else {
                    this.modalName.value = '';
                    this.modalCategory.value = '';
                    this.modalContent.value = '';
                }
                this.handleTagInput();
                this.setEditorMode('edit');
                this.modal.classList.add('open');
            }

            closeModal() {
                this.modal.classList.remove('open');
            }

            handleSaveModal() {
                const name = this.modalName.value.trim();
                const category = this.modalCategory.value.trim();
                const content = this.modalContent.value.trim();

                if (!name || !content) return alert('Name and Content required');

                const data = { name, category, content };

                if (this.editingId) {
                    this.promptManager.update(this.editingId, data);
                } else {
                    this.promptManager.add(data);
                }

                this.renderPrompts();
                this.renderCategories();
                this.closeModal();
            }

            // Category Manager
            openCatManager() {
                const list = document.getElementById('catManagerList');
                list.innerHTML = '';
                const categories = Array.from(this.promptManager.getCategories()).sort();

                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'category-btn'; // Reuse style
                    btn.textContent = cat;
                    btn.style.border = '1px solid var(--border-color)';
                    btn.onclick = () => {
                        const newName = prompt("Rename category:", cat);
                        if (newName && newName.trim() !== "" && newName !== cat) {
                            this.promptManager.renameCategory(cat, newName.trim());
                            this.renderPrompts();
                            this.renderCategories();
                            this.openCatManager(); // Refresh list
                            this.showToast("Category Renamed");
                        }
                    };
                    list.appendChild(btn);
                });

                document.getElementById('catModal').classList.add('open');
            }

            openSyncModal() {
                const urlInput = document.getElementById('syncUrlInput');
                const onLoadCheck = document.getElementById('syncOnLoad');
                urlInput.value = this.promptManager.syncUrl;
                onLoadCheck.checked = this.promptManager.syncOnLoad;
                document.getElementById('syncModal').classList.add('open');
            }

            async handleSync() {
                const urlInput = document.getElementById('syncUrlInput');
                const onLoadCheck = document.getElementById('syncOnLoad');
                const url = urlInput.value.trim();
                if (!url) return alert('Please enter a URL');

                const confirmBtn = document.getElementById('confirmSync');
                const statusEl = document.getElementById('syncStatus');
                confirmBtn.textContent = 'Syncing…';
                confirmBtn.disabled = true;

                // Save settings regardless
                this.promptManager.saveSyncSettings(url, onLoadCheck.checked);

                try {
                    const incoming = await this.promptManager.fetchFromUrl(url);
                    const { added, skipped } = this.promptManager.mergePrompts(incoming);
                    this.renderPrompts();
                    this.renderCategories();
                    document.getElementById('syncModal').classList.remove('open');
                    const msg = added > 0
                        ? `✓ Synced: ${added} new prompt${added !== 1 ? 's' : ''} added${skipped ? `, ${skipped} skipped` : ''}`
                        : `✓ Up to date — no new prompts${skipped ? ` (${skipped} skipped)` : ''}`;
                    statusEl.textContent = msg;
                    this.showToast(added > 0 ? `+${added} prompts synced!` : 'Already up to date');
                    setTimeout(() => statusEl.textContent = '', 8000);
                } catch (err) {
                    this.showToast('Sync failed!');
                    statusEl.textContent = `✗ ${err.message}`;
                    setTimeout(() => statusEl.textContent = '', 8000);
                } finally {
                    confirmBtn.textContent = 'Sync Now';
                    confirmBtn.disabled = false;
                }
            }

            async autoSync() {
                const { syncUrl, syncOnLoad } = this.promptManager;
                if (!syncOnLoad || !syncUrl) return;
                const statusEl = document.getElementById('syncStatus');
                statusEl.textContent = '⏳ Auto-syncing…';
                try {
                    const incoming = await this.promptManager.fetchFromUrl(syncUrl);
                    const { added } = this.promptManager.mergePrompts(incoming);
                    if (added > 0) {
                        this.renderPrompts();
                        this.renderCategories();
                        statusEl.textContent = `✓ Auto-synced: +${added} new prompt${added !== 1 ? 's' : ''}`;
                    } else {
                        statusEl.textContent = '✓ Up to date';
                    }
                    setTimeout(() => statusEl.textContent = '', 5000);
                } catch (err) {
                    statusEl.textContent = `✗ Auto-sync failed: ${err.message}`;
                    setTimeout(() => statusEl.textContent = '', 8000);
                }
            }

            // Import/Export
            exportPrompts() {
                const prompts = this.promptManager.getAll();
                if (prompts.length === 0) return this.showToast("Nothing to export");
                
                const exportData = {
                    version: 1,
                    timestamp: new Date().toISOString(),
                    prompts: prompts
                };

                const content = JSON.stringify(exportData, null, 2);
                const blob = new Blob([content], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `prompts_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast("Exported JSON");
            }

            importPrompts(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        let imported = [];
                        
                        if (Array.isArray(json)) {
                            imported = json;
                        } else if (json.prompts && Array.isArray(json.prompts)) {
                            imported = json.prompts;
                        } else {
                            throw new Error("Invalid format: Root must be array or versioned object");
                        }
                        
                        let importedCount = 0;
                        let skippedCount = 0;

                        imported.forEach(p => {
                            if (p.name && typeof p.name === 'string' && 
                                p.content && typeof p.content === 'string') {
                                
                                // Validation
                                if (p.content.length > 100000) {
                                    console.warn(`Skipping prompt "${p.name}" - Content exceeds 100k characters.`);
                                    return;
                                }

                                // Sanitize: Create clean object
                                const newPromptData = {
                                    name: p.name.substring(0, 200), // Limit name length
                                    category: (p.category && typeof p.category === 'string') ? p.category.substring(0, 500) : '',
                                    content: p.content
                                };

                                // Check for duplicates against LIVE list
                                // This prevents adding if name AND content match exactly
                                const isDuplicate = this.promptManager.getAll().some(existing => 
                                    existing.name === newPromptData.name && 
                                    existing.content === newPromptData.content
                                );

                                if (isDuplicate) {
                                    skippedCount++;
                                    return;
                                }
                                
                                this.promptManager.add(newPromptData);
                                importedCount++;
                            }
                        });

                        this.renderPrompts();
                        this.renderCategories();
                        
                        let msg = `Imported ${importedCount} prompts`;
                        if (skippedCount > 0) msg += `, Skipped ${skippedCount} duplicates`;
                        this.showToast(msg);
                    } catch (err) {
                        alert("Invalid JSON file: " + err.message);
                    }
                    document.getElementById('importInput').value = '';
                };
                reader.readAsText(file);
            }

            // Utilities
            showToast(msg = 'Copied!') {
                this.toast.textContent = msg;
                this.toast.classList.add('show');
                setTimeout(() => this.toast.classList.remove('show'), 2000);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize App
        const promptManager = new PromptManager();
        const uiManager = new UIManager(promptManager);
        uiManager.init();
    </script>
</body>

</html>
