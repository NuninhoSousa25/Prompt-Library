<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:             #0f0e0e;
            --sidebar-bg:     #1e1e1e;
            --card-bg:        #1e1e1e;
            --text-primary:   #e6dfdf;
            --text-secondary: #d5d2ce;
            --border:         rgba(245, 240, 232, 0.12);
            --accent:         #ffffff;
            --danger:         #e09191;
            --serif:          'Instrument Serif', Georgia, serif;
            --mono:           'Geist Mono', 'Courier New', monospace;
            --sidebar-width:           220px;
            --sidebar-collapsed-width: 56px;
            --detail-width:            360px;
        }

        body.light-mode {
            --bg:             #e3dfd8;
            --sidebar-bg:     #d9d5ce;
            --card-bg:        #dfdedb;
            --text-primary:   #000000;
            --text-secondary: #444039;
            --border:         rgba(0, 0, 0, 0.15);
            --accent:         #000000;
            --danger:         #a63a3a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ─── Sidebar ───────────────────────────────────────── */
        .sidebar-left {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.25s ease;
            padding: 1rem;
        }

        .sidebar-left.collapsed {
            width: var(--sidebar-collapsed-width);
            padding: 0.5rem;
        }

        /* Sidebar top row: title + toggle */
        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .sidebar-left.collapsed .sidebar-top {
            justify-content: center;
            margin-bottom: 1rem;
        }

        .app-title {
            font-family: var(--serif);
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar-left.collapsed .app-title { display: none; }

        .sidebar-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
            transition: color 0.15s, border-color 0.15s;
        }
        .sidebar-toggle:hover { color: var(--text-primary); border-color: var(--text-secondary); }

        /* Nav section */
        .nav-section { margin-bottom: 1.25rem; flex-shrink: 0; overflow-y: auto; }
        .sidebar-left.collapsed .nav-section { display: none; }

        .nav-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-secondary);
            margin-bottom: 0.6rem;
            white-space: nowrap;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .category-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            text-align: left;
            padding: 0.35rem 0.6rem;
            border-radius: 5px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            width: 100%;
            font-size: 12px;
            font-family: var(--mono);
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-btn:hover { color: var(--text-primary); background: var(--border); }
        .category-btn.active { color: var(--text-primary); background: rgba(255,255,255,0.06); }

        /* Category Tree */
        .category-node { display: flex; align-items: center; width: 100%; margin-bottom: 1px; }

        .category-toggle {
            width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); font-size: 0.6rem;
            transition: transform 0.2s; background: none; border: none; padding: 0; flex-shrink: 0;
        }
        .category-toggle:hover { color: var(--text-primary); }
        .category-toggle.rotated { transform: rotate(90deg); }
        .category-toggle.invisible { visibility: hidden; }

        .category-button {
            flex: 1; text-align: left; background: none; border: none;
            color: var(--text-secondary); padding: 0.3rem 0.45rem; border-radius: 5px;
            cursor: pointer; font-size: 12px; font-family: var(--mono);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            transition: color 0.15s, background 0.15s;
        }
        .category-button:hover { color: var(--text-primary); background: var(--border); }
        .category-button.active { color: var(--text-primary); background: rgba(255,255,255,0.06); }

        .category-sub-list {
            list-style: none; padding-left: 1rem; display: none;
            flex-direction: column; gap: 1px;
        }
        .category-sub-list.open { display: flex; }

        .category-node.drag-over { background: rgba(255,255,255,0.05); outline: 1px dashed var(--text-secondary); border-radius: 5px; }
        .category-node.drag-over-top { border-top: 1px solid var(--text-primary); }
        .category-node.drag-over-bottom { border-bottom: 1px solid var(--text-primary); }
        .category-list.drag-over { background: rgba(255,255,255,0.02); outline: 1px dashed var(--border); border-radius: 5px; }

        /* Bottom actions */
        .bottom-actions {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex-shrink: 0;
        }

        .bottom-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            padding: 0.1rem 0.6rem 0.4rem;
            white-space: nowrap;
        }

        /* Collapsed: icon-only bottom actions */
        .sidebar-left.collapsed .bottom-label { display: none; }
        .sidebar-left.collapsed .syncStatus-wrap { display: none; }
        .sidebar-left.collapsed .bottom-actions {
            align-items: center;
            gap: 2px;
        }
        .sidebar-left.collapsed .bottom-actions .category-btn {
            font-size: 0;
            padding: 0;
            width: 36px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-left.collapsed .bottom-actions .category-btn::before {
            content: attr(data-icon);
            font-size: 13px;
            display: block;
        }

        /* ─── Main Content ──────────────────────────────────── */
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

        .top-bar {
            height: 52px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 1.5rem;
            justify-content: space-between;
            background: var(--bg);
            flex-shrink: 0;
            gap: 1rem;
        }

        .search-bar {
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.4rem 0.85rem;
            border-radius: 5px;
            color: var(--text-primary);
            flex: 1;
            max-width: 380px;
            font-size: 12px;
            font-family: var(--mono);
            transition: border-color 0.2s;
        }
        .search-bar::placeholder { color: var(--text-secondary); }
        .search-bar:focus { outline: none; border-color: var(--text-secondary); }

        .add-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--mono);
            letter-spacing: 0.04em;
            transition: opacity 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .add-btn:hover { opacity: 0.75; }

        /* ─── Content Row (cards + detail panel) ───────────── */
        .content-row {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            min-width: 0;
        }

        /* ─── Card Grid ─────────────────────────────────────── */
        .prompt-grid { columns: 2; column-gap: 1rem; }
        .prompt-grid .prompt-card { break-inside: avoid; margin-bottom: 1rem; display: inline-block; width: 100%; }
        @media (max-width: 1100px) { .prompt-grid { columns: 1; } }

        /* ─── Card ──────────────────────────────────────────── */
        .prompt-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.15s, box-shadow 0.15s;
            overflow: hidden;
        }
        .prompt-card:hover {
            border-color: rgba(255,255,255,0.14);
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .prompt-card.selected {
            border-color: var(--text-primary);
        }

        .card-clickable {
            padding: 1rem 1.1rem 0.85rem;
            cursor: pointer;
            flex: 1;
        }

        .card-title {
            font-family: var(--mono);
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.35;
            color: var(--accent);
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }

        .card-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.6rem; }

        .card-category {
            font-size: 11px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            display: inline-block;
            cursor: pointer;
            font-family: var(--mono);
            transition: border-color 0.15s, color 0.15s;
        }
        .card-category:hover { border-color: var(--text-secondary); color: var(--text-primary); }

        .card-snippet {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.65;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 0.25rem;
            padding: 0.5rem 0.75rem;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 11px; font-family: var(--mono);
            padding: 0.2rem 0.45rem; border-radius: 4px; transition: 0.15s;
            letter-spacing: 0.02em;
        }
        .action-btn:hover { background: var(--border); color: var(--text-primary); }
        .btn-delete:hover { color: var(--danger); background: rgba(180,82,82,0.08); }

        /* ─── Detail Panel ──────────────────────────────────── */
        .detail-panel {
            width: var(--detail-width);
            flex-shrink: 0;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--sidebar-bg);
            overflow: hidden;
            transition: width 0.25s ease, border-color 0.25s ease;
        }

        .detail-panel.hidden {
            width: 0;
            border-left-color: transparent;
        }

        .detail-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .detail-header {
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .detail-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .detail-title {
            font-family: var(--mono);
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent);
            line-height: 1.35;
            letter-spacing: -0.01em;
        }

        .detail-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            flex-shrink: 0;
            line-height: 1;
            transition: color 0.15s;
        }
        .detail-close:hover { color: var(--text-primary); }

        .detail-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }

        .detail-body-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .detail-body {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .detail-actions {
            padding: 0.85rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .detail-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.35rem 0.85rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--mono);
            letter-spacing: 0.04em;
            transition: 0.15s;
        }
        .detail-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }
        .detail-btn.primary { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }
        .detail-btn.primary:hover { opacity: 0.8; }
        .detail-btn.danger:hover { color: var(--danger); border-color: var(--danger); background: rgba(180,82,82,0.08); }

        /* ─── Markdown in cards and detail ─────────────────── */
        .card-body h1, .card-body h2, .card-body h3,
        .detail-body h1, .detail-body h2, .detail-body h3 {
            color: var(--accent); font-weight: 500;
            margin: 0.75rem 0 0.3rem; line-height: 1.3;
            font-family: var(--mono);
        }
        .card-body h1, .detail-body h1 { font-size: 0.95rem; }
        .card-body h2, .detail-body h2 { font-size: 0.88rem; letter-spacing: 0.02em; }
        .card-body h3, .detail-body h3 { font-size: 0.82rem; }

        .card-body p, .detail-body p { margin: 0.4rem 0; }
        .card-body hr, .detail-body hr { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; }
        .card-body ul, .card-body ol,
        .detail-body ul, .detail-body ol { padding-left: 1.1rem; margin: 0.3rem 0; }
        .card-body li, .detail-body li { margin: 0.15rem 0; }

        .card-body pre, .detail-body pre {
            background: rgba(0,0,0,0.3);
            padding: 2rem 0.75rem 0.75rem;
            border-radius: 5px; overflow-x: auto; margin: 0.5rem 0;
            border: 1px solid var(--border);
        }
        .code-block-wrapper { position: relative; margin: 0.5rem 0; }
        .copy-code-btn {
            position: absolute; top: 5px; right: 5px;
            background: rgba(255,255,255,0.07); border: 1px solid var(--border);
            color: var(--text-secondary); font-size: 10px; font-family: var(--mono);
            padding: 2px 7px; border-radius: 4px; cursor: pointer; z-index: 5; transition: 0.15s;
        }
        .copy-code-btn:hover { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }

        .card-body code, .detail-body code {
            font-family: var(--mono); font-size: 0.85em;
            background: rgba(255,255,255,0.07);
            padding: 0.1rem 0.3rem; border-radius: 4px;
            color: var(--text-primary);
        }
        .card-body pre code, .detail-body pre code { background: transparent; padding: 0; }
        .card-body strong, .detail-body strong { color: var(--text-primary); font-weight: 500; }
        .card-body em, .detail-body em { color: var(--text-primary); font-style: italic; }

        mark {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 0 2px; border-radius: 4px;
        }

        /* ─── Tag UI (modal) ────────────────────────────────── */
        .tag-preview { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.4rem; min-height: 22px; }
        .tag-chip {
            background: var(--text-primary); color: var(--bg);
            padding: 0.15rem 0.55rem; border-radius: 5px; font-size: 11px; font-family: var(--mono);
        }
        .tag-suggestions {
            display: flex; flex-wrap: wrap; gap: 0.4rem;
            margin-bottom: 0.75rem; margin-top: -0.4rem;
            max-height: 80px; overflow-y: auto;
        }
        .tag-suggestion-item {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-secondary); padding: 0.15rem 0.55rem;
            border-radius: 5px; font-size: 11px; font-family: var(--mono);
            cursor: pointer; transition: 0.15s;
        }
        .tag-suggestion-item:hover { border-color: var(--text-primary); color: var(--text-primary); }

        /* ─── Full-width buttons ────────────────────────────── */
        .full-btn {
            flex: 1; padding: 0.5rem; border-radius: 5px;
            border: none; cursor: pointer;
            font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
            transition: opacity 0.15s;
        }
        .full-btn:hover { opacity: 0.8; }
        .btn-copy { background: var(--text-primary); color: var(--bg); }
        .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }

        /* ─── Modals ────────────────────────────────────────── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(3px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--card-bg);
            padding: 1.5rem; border-radius: 6px;
            width: 800px; max-width: 95vw; max-height: 95vh;
            overflow-y: auto; border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }

        input, textarea.form-input {
            width: 100%; background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.55rem 0.75rem; margin-bottom: 0.6rem;
            border-radius: 5px; font-family: var(--mono);
            font-size: 12px; transition: border-color 0.15s;
        }
        input:focus, textarea.form-input:focus { outline: none; border-color: var(--text-secondary); }
        input::placeholder, textarea.form-input::placeholder { color: var(--text-secondary); }

        /* ─── Toast ─────────────────────────────────────────── */
        #toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary); color: var(--bg);
            padding: 0.5rem 1.1rem; border-radius: 5px;
            opacity: 0; pointer-events: none; transition: 0.25s;
            font-size: 11px; letter-spacing: 0.06em; font-family: var(--mono);
            white-space: nowrap;
        }
        #toast.show { opacity: 1; bottom: 2.5rem; }

        /* ─── Empty state ───────────────────────────────────── */
        .empty-state {
            text-align: center; color: var(--text-secondary);
            margin-top: 4rem; font-size: 12px; letter-spacing: 0.08em;
        }
        .empty-state::before {
            content: '—';
            display: block;
            font-family: var(--serif);
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: var(--border);
        }

        /* ─── Wide modal ─────────────────────────────────────── */
        .modal-wide { width: min(1100px, 95vw) !important; }

        /* ─── Editor toggle ─────────────────────────────────── */
        .preview-toggle-group {
            display: flex; border: 1px solid var(--border);
            border-radius: 5px; overflow: hidden;
        }
        .preview-toggle {
            background: none; border: none; color: var(--text-secondary);
            padding: 0.3rem 0.75rem; font-size: 11px; font-family: var(--mono);
            cursor: pointer; transition: background 0.15s, color 0.15s; letter-spacing: 0.04em;
        }
        .preview-toggle:not(:last-child) { border-right: 1px solid var(--border); }
        .preview-toggle.active, .preview-toggle:hover {
            background: rgba(255,255,255,0.06); color: var(--text-primary);
        }

        /* ─── Editor panes ──────────────────────────────────── */
        .editor-panes { display: flex; gap: 0.75rem; height: 420px; }
        .editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .pane-label {
            font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--text-secondary); margin-bottom: 0.3rem;
        }
        .editor-textarea {
            flex: 1; resize: none; min-height: 0; margin: 0 !important;
            font-family: var(--mono); font-size: 12px; line-height: 1.7;
        }
        .preview-pane { display: none; }
        .editor-preview-body {
            flex: 1; overflow-y: auto;
            background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: 5px; padding: 0.75rem 0.9rem;
            font-size: 12px; line-height: 1.75; color: var(--text-secondary);
        }
        .editor-panes.mode-edit .preview-pane   { display: none; }
        .editor-panes.mode-edit .editor-pane    { display: flex; }
        .editor-panes.mode-preview .editor-pane { display: none; }
        .editor-panes.mode-preview .preview-pane { display: flex; }
        .editor-panes.mode-split .editor-pane   { display: flex; }
        .editor-panes.mode-split .preview-pane  { display: flex; }
    </style>
</head>

<body>

    <!-- Left Sidebar -->
    <aside class="sidebar-left" id="sidebarLeft">
        <div class="sidebar-top">
            <div class="app-title">Prompt Lib</div>
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">◀</button>
        </div>

        <div class="nav-section">
            <div class="nav-label">Categories</div>
            <ul class="category-list" id="categoryList">
                <!-- Populated by JS -->
            </ul>
        </div>

        <div class="bottom-actions">
            <div class="bottom-label">Actions</div>
            <button class="category-btn" id="manageCatsBtn" data-icon="⚙" title="Manage Categories">Manage Categories</button>
            <button class="category-btn" id="themeBtn" data-icon="◑" title="Toggle Theme">Toggle Theme</button>

                Fetches a <code style="font-size:11px; background:rgba(255,255,255,0.07); padding:1px 5px; border-radius:3px;">prompts_backup.json</code> from the URL below and merges new prompts in. Existing local prompts are never deleted.

    <div id="toast"></div>

    <script>
        // ─── Data Layer ──────────────────────────────────────────────────────────────
        const DEFAULT_SYNC_URL = 'https://nuno-sousa.com/repository/uploads/prompts_backup.json';

        class PromptManager {
            constructor() {
                this.prompts = JSON.parse(localStorage.getItem('prompts')) || [];
                this.categoryOrder = JSON.parse(localStorage.getItem('categoryOrder')) || [];
                this.syncUrl = localStorage.getItem('syncUrl') || DEFAULT_SYNC_URL;
                this.syncOnLoad = localStorage.getItem('syncOnLoad') === 'true';
                this.migrate();
            }

            saveSyncSettings(url, onLoad) {
                this.syncUrl = url;
                this.syncOnLoad = onLoad;
                localStorage.setItem('syncUrl', url);
                localStorage.setItem('syncOnLoad', onLoad ? 'true' : 'false');
            }

            async fetchFromUrl(url) {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                let incoming = [];
                if (Array.isArray(json)) {
                    incoming = json;
                } else if (json.prompts && Array.isArray(json.prompts)) {
                    incoming = json.prompts;
                } else {
                    throw new Error('Invalid format: expected array or { prompts: [] }');
                }
                return incoming;
            }

            mergePrompts(incoming) {
                let added = 0, skipped = 0;
                incoming.forEach(p => {
                    if (!p.name || !p.content) return;
                    if (p.content.length > 100000) { skipped++; return; }
                    const isDuplicate = this.prompts.some(e =>
                        e.name === p.name.substring(0, 200) && e.content === p.content
                    );
                    if (isDuplicate) { skipped++; return; }
                    this.add({
                        name: p.name.substring(0, 200),
                        category: (p.category && typeof p.category === 'string') ? p.category.substring(0, 500) : '',
                        content: p.content
                    });
                    added++;
                });
                return { added, skipped };
            }

            migrate() {
                let changed = false;
                this.prompts.forEach(p => {
                    if (!p.id) { p.id = this.generateId(); changed = true; }
                });
                const activeCats = this.getActiveCategories();
                this.cleanupCategoryOrder(activeCats);
                if (changed) this.save();
            }

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            getAll() { return this.prompts; }
            get(id) { return this.prompts.find(p => p.id === id); }

            add(prompt) {
                prompt.id = this.generateId();
                this.prompts.unshift(prompt);
                this.save();
            }

            update(id, data) {
                const index = this.prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.prompts[index] = { ...this.prompts[index], ...data };
                    this.save();
                    this.cleanupCategoryOrder(this.getActiveCategories());
                }
            }

            delete(id) {
                const index = this.prompts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.prompts.splice(index, 1);
                    this.save();
                    this.cleanupCategoryOrder(this.getActiveCategories());
                }
            }

            save() { localStorage.setItem('prompts', JSON.stringify(this.prompts)); }
            saveOrder() { localStorage.setItem('categoryOrder', JSON.stringify(this.categoryOrder)); }

            cleanupCategoryOrder(activeCategories) {
                const activeSet = new Set(activeCategories);
                const newOrder = this.categoryOrder.filter(cat => activeSet.has(cat));
                if (newOrder.length !== this.categoryOrder.length) {
                    this.categoryOrder = newOrder;
                    this.saveOrder();
                }
            }

            getActiveCategories() {
                const tags = new Set();
                this.prompts.forEach(p => {
                    if (p.category) {
                        p.category.split(',').map(tag => tag.trim()).filter(Boolean).forEach(tag => tags.add(tag));
                    }
                });
                return Array.from(tags);
            }

            getCategories() {
                const catArray = this.getActiveCategories();
                catArray.sort((a, b) => {
                    const idxA = this.categoryOrder.indexOf(a);
                    const idxB = this.categoryOrder.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
                return catArray;
            }

            reorderCategory(moved, target, position) {
                const currentCats = this.getCategories();
                const fullOrder = [...this.categoryOrder];
                currentCats.forEach(c => { if (!fullOrder.includes(c)) fullOrder.push(c); });
                const movedIdx = fullOrder.indexOf(moved);
                if (movedIdx === -1) return;
                fullOrder.splice(movedIdx, 1);
                let targetIdx = fullOrder.indexOf(target);
                if (targetIdx === -1) {
                    fullOrder.push(moved);
                } else {
                    if (position === 'after') targetIdx++;
                    fullOrder.splice(targetIdx, 0, moved);
                }
                this.categoryOrder = fullOrder;
                this.saveOrder();
            }

            renameCategory(oldName, newName) {
                let changed = false;
                this.prompts.forEach(p => {
                    if (p.category) {
                        const tags = p.category.split(',').map(t => t.trim());
                        if (tags.includes(oldName)) {
                            p.category = tags.map(t => t === oldName ? newName : t).join(', ');
                            changed = true;
                        }
                    }
                });
                if (changed) this.save();
                return changed;
            }

            moveCategory(oldPath, newParentPath) {
                const name = oldPath.split('/').pop();
                const newPath = newParentPath ? `${newParentPath}/${name}` : name;
                if (newParentPath && (newParentPath === oldPath || newParentPath.startsWith(oldPath + '/'))) return false;
                let changed = false;
                this.prompts.forEach(p => {
                    if (p.category) {
                        const tags = p.category.split(',').map(t => t.trim());
                        const newTags = tags.map(tag => {
                            if (tag === oldPath || tag.startsWith(oldPath + '/')) {
                                changed = true;
                                return newPath + tag.substring(oldPath.length);
                            }
                            return tag;
                        });
                        p.category = newTags.join(', ');
                    }
                });
                if (changed) this.save();
                return changed;
            }
        }

        // ─── UI Layer ────────────────────────────────────────────────────────────────
        class UIManager {
            constructor(promptManager) {
                this.promptManager = promptManager;
                this.activeCategory = 'all';
                this.searchTerm = '';
                this.selectedPromptId = null;

                // Elements
                this.grid = document.getElementById('promptGrid');
                this.catList = document.getElementById('categoryList');
                this.modal = document.getElementById('modal');
                this.toast = document.getElementById('toast');
                this.modalName = document.getElementById('modalName');
                this.modalCategory = document.getElementById('modalCategory');
                this.tagPreview = document.getElementById('tagPreview');
                this.tagSuggestions = document.getElementById('tagSuggestions');
                this.modalContent = document.getElementById('modalContent');
                this.editingId = null;
                this.varModal = document.getElementById('varModal');
                this.varInputsContainer = document.getElementById('varModalInputs');
                this.pendingCopyText = null;

                // Detail panel elements
                this.detailPanelEl   = document.getElementById('detailPanel');
                this.detailContentEl = document.getElementById('detailContent');

                this.initSidebar();
                this.initTheme();
                this.bindEvents();
            }

            // ── Sidebar collapse ─────────────────────────────────────────────────────
            initSidebar() {
                const sidebar = document.getElementById('sidebarLeft');
                const toggle  = document.getElementById('sidebarToggle');
                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    sidebar.classList.add('collapsed');
                    toggle.textContent = '▶';
                }
                toggle.addEventListener('click', () => {
                    const isCollapsed = sidebar.classList.toggle('collapsed');
                    toggle.textContent = isCollapsed ? '▶' : '◀';
                    localStorage.setItem('sidebarCollapsed', isCollapsed);
                });
            }

            // ── Detail panel ─────────────────────────────────────────────────────────
            selectPrompt(id) {
                document.querySelectorAll('.prompt-card').forEach(c => c.classList.remove('selected'));
                const cardEl = document.querySelector(`.prompt-card[data-id="${id}"]`);
                if (cardEl) cardEl.classList.add('selected');
                this.selectedPromptId = id;
                this.detailPanelEl.classList.remove('hidden');
                this.renderDetailPanel(id);
            }

            renderDetailPanel(id) {
                const p = this.promptManager.get(id);
                if (!p) { this.clearDetailPanel(); return; }

                this.detailContentEl.style.display = 'flex';

                document.getElementById('detailTitle').textContent = p.name;

                const tagsHtml = p.category
                    ? p.category.split(',').map(tag => {
                        const trimmed = tag.trim();
                        const leaf = trimmed.split('/').pop();
                        return `<span class="card-category" title="${this.escapeHtml(trimmed)}" onclick="setCategory('${trimmed.replace(/'/g, "\\'")}')">
                            ${this.escapeHtml(leaf)}
                        </span>`;
                      }).join('')
                    : '';
                document.getElementById('detailTags').innerHTML = tagsHtml;
                document.getElementById('detailBody').innerHTML = this.parseMarkdown(p.content);
            }

            clearDetailPanel() {
                this.selectedPromptId = null;
                this.detailPanelEl.classList.add('hidden');
                this.detailContentEl.style.display = 'none';
                document.querySelectorAll('.prompt-card').forEach(c => c.classList.remove('selected'));
            }

            // ── Events ───────────────────────────────────────────────────────────────
            debounce(func, wait) {
                let timeout;
                return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); };
            }

            bindEvents() {
                document.getElementById('openAddModalBtn').addEventListener('click', () => this.openModal());
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                document.getElementById('saveModal').addEventListener('click', () => this.handleSaveModal());
                this.modalCategory.addEventListener('input', () => this.handleTagInput());
                document.getElementById('modalContent').addEventListener('input', () => this.updateModalPreview());
                window.setEditorMode = (mode) => this.setEditorMode(mode);
                document.getElementById('manageCatsBtn').addEventListener('click', () => this.openCatManager());
                document.getElementById('closeCatModal').addEventListener('click', () => document.getElementById('catModal').classList.remove('open'));
                document.getElementById('themeBtn').addEventListener('click', () => this.toggleTheme());
                document.getElementById('closeVarModal').addEventListener('click', () => this.closeVarModal());
                document.getElementById('confirmVarModal').addEventListener('click', () => this.handleVarSubmit());
                document.getElementById('searchInput').addEventListener('input', this.debounce((e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.renderPrompts();
                }, 250));
                document.getElementById('exportBtn').addEventListener('click', () => this.exportPrompts());
                document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importInput').click());
                document.getElementById('importInput').addEventListener('change', (e) => this.importPrompts(e));
                document.getElementById('syncBtn').addEventListener('click', () => this.openSyncModal());
                document.getElementById('closeSyncModal').addEventListener('click', () => document.getElementById('syncModal').classList.remove('open'));
                document.getElementById('confirmSync').addEventListener('click', () => this.handleSync());
                document.getElementById('deleteAllBtn').addEventListener('click', () => this.deleteAll());

                // Global handlers
                window.setCategory    = (cat) => this.setCategory(cat);
                window.deletePrompt   = (id)  => this.deletePrompt(id);
                window.copyPrompt     = (id)  => this.copyPrompt(id);
                window.downloadPrompt = (id)  => this.downloadPrompt(id);
                window.copyText       = (text) => this.copyText(text);
                window.openEdit       = (id)  => this.openModal(id);
                window.copyCodeBlock  = (btn) => this.copyCodeBlock(btn);
                window.addTag         = (tag) => this.addTag(tag);
                window.selectPrompt   = (id)  => this.selectPrompt(id);
                window.clearDetailPanel = () => this.clearDetailPanel();
                window.detailCopy     = () => { if (this.selectedPromptId) this.copyPrompt(this.selectedPromptId); };
                window.detailEdit     = () => { if (this.selectedPromptId) this.openModal(this.selectedPromptId); };
                window.detailDownload = () => { if (this.selectedPromptId) this.downloadPrompt(this.selectedPromptId); };
                window.detailDelete   = () => { if (this.selectedPromptId) this.deletePrompt(this.selectedPromptId); };
            }

            init() {
                this.renderPrompts();
                this.renderCategories();
                this.autoSync();
            }

            // ── Theme ────────────────────────────────────────────────────────────────
            initTheme() {
                const theme = localStorage.getItem('theme') || 'dark';
                if (theme === 'light') document.body.classList.add('light-mode');
            }

            toggleTheme() {
                document.body.classList.toggle('light-mode');
                const theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
                localStorage.setItem('theme', theme);
            }

            // ── Categories ───────────────────────────────────────────────────────────
            setCategory(cat) {
                this.activeCategory = cat;
                this.renderPrompts();
                this.updateActiveCategoryUI();
            }

            updateActiveCategoryUI() {
                document.querySelectorAll('.category-button, .category-btn[data-cat]').forEach(b => b.classList.remove('active'));
                if (this.activeCategory === 'all') {
                    const allBtn = document.getElementById('cat-btn-all');
                    if (allBtn) allBtn.classList.add('active');
                } else {
                    const btn = document.querySelector(`.category-button[data-cat="${this.activeCategory.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"]`);
                    if (btn) btn.classList.add('active');
                }
            }

            buildTree(tags) {
                const tree = {};
                tags.forEach(tag => {
                    const parts = tag.split('/');
                    let currentLevel = tree;
                    let currentPath = '';
                    parts.forEach((part) => {
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        if (!currentLevel[part]) {
                            currentLevel[part] = { name: part, fullPath: currentPath, children: {} };
                        }
                        currentLevel = currentLevel[part].children;
                    });
                });
                return tree;
            }

            renderCategories() {
                const categories = this.promptManager.getCategories();
                const tree = this.buildTree(categories);
                this.catList.innerHTML = '';

                const allLi = document.createElement('li');
                allLi.innerHTML = `
                    <div class="category-node" id="cat-root-dropzone">
                        <span class="category-toggle invisible">▶</span>
                        <button id="cat-btn-all" class="category-button ${this.activeCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">All Prompts</button>
                    </div>`;
                this.catList.appendChild(allLi);

                const rootZone = allLi.querySelector('.category-node');
                this.setupDropZone(rootZone, null);
                this.renderTreeLevel(tree, this.catList);
                this.setupDropZone(this.catList, null);
            }

            setupDropZone(element, path) {
                element.ondragover  = (e) => this.handleDragOver(e, element, path);
                element.ondragleave = (e) => this.handleDragLeave(e, element);
                element.ondrop      = (e) => this.handleDrop(e, element, path);
            }

            handleDragOver(e, element, path) {
                e.preventDefault(); e.stopPropagation();
                if (element === this.catList) { element.classList.add('drag-over'); return; }
                const rect = element.getBoundingClientRect();
                const relY = e.clientY - rect.top;
                const height = rect.height;
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
                if (path === null) { element.classList.add('drag-over'); return; }
                if (relY < height * 0.25) { element.classList.add('drag-over-top'); element.dataset.dropAction = 'before'; }
                else if (relY > height * 0.75) { element.classList.add('drag-over-bottom'); element.dataset.dropAction = 'after'; }
                else { element.classList.add('drag-over'); element.dataset.dropAction = 'inside'; }
            }

            handleDragLeave(e, element) {
                e.stopPropagation();
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
            }

            handleDrop(e, element, path) {
                e.preventDefault(); e.stopPropagation();
                element.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
                const oldPath = e.dataTransfer.getData('text/plain');
                if (!oldPath) return;
                if (element === this.catList || path === null) {
                    if (this.promptManager.moveCategory(oldPath, null)) { this.refreshUI(); this.showToast('Moved to Top Level'); }
                    return;
                }
                const action = element.dataset.dropAction;
                if (action === 'inside') {
                    if (this.promptManager.moveCategory(oldPath, path)) { this.refreshUI(); this.showToast('Nested Category'); }
                } else if (action === 'before' || action === 'after') {
                    this.promptManager.reorderCategory(oldPath, path, action);
                    this.refreshUI();
                    this.showToast('Reordered Category');
                }
            }

            refreshUI() { this.renderPrompts(); this.renderCategories(); }

            renderTreeLevel(nodes, container) {
                const sortedKeys = Object.keys(nodes).sort((a, b) => {
                    const allCats = this.promptManager.getCategories();
                    return allCats.indexOf(nodes[a].fullPath) - allCats.indexOf(nodes[b].fullPath);
                });

                sortedKeys.forEach(key => {
                    const node = nodes[key];
                    const hasChildren = Object.keys(node.children).length > 0;
                    const li = document.createElement('li');
                    const row = document.createElement('div');
                    row.className = 'category-node';
                    row.draggable = true;
                    row.ondragstart = (e) => { e.dataTransfer.setData('text/plain', node.fullPath); e.stopPropagation(); };
                    this.setupDropZone(row, node.fullPath);

                    const toggle = document.createElement('button');
                    toggle.className = `category-toggle ${hasChildren ? '' : 'invisible'}`;
                    toggle.textContent = '▶';
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.onclick = (e) => { e.stopPropagation(); this.toggleSubMenu(toggle, subList); };

                    const btn = document.createElement('button');
                    btn.className = `category-button ${this.activeCategory === node.fullPath ? 'active' : ''}`;
                    btn.textContent = node.name;
                    btn.dataset.cat = node.fullPath;
                    btn.onclick = () => this.setCategory(node.fullPath);

                    row.appendChild(toggle);
                    row.appendChild(btn);
                    li.appendChild(row);

                    const subList = document.createElement('ul');
                    subList.className = 'category-sub-list';
                    if (hasChildren) this.renderTreeLevel(node.children, subList);
                    li.appendChild(subList);
                    container.appendChild(li);
                });
            }

            toggleSubMenu(toggle, list) {
                const isOpen = list.classList.toggle('open');
                toggle.classList.toggle('rotated');
                toggle.setAttribute('aria-expanded', isOpen);
            }

            // ── Markdown ─────────────────────────────────────────────────────────────
            parseMarkdown(text) {
                if (!text) return '';
                const codeBlocks = [];
                text = text.replace(/```([\w]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                    const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const idx = codeBlocks.length;
                    codeBlocks.push(`<div class="code-block-wrapper"><button class="copy-code-btn" onclick="copyCodeBlock(this)">Copy</button><pre><code>${escaped}</code></pre></div>`);
                    return `\x00CODE${idx}\x00`;
                });
                text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                const lines = text.split('\n');
                const output = [];
                let i = 0;
                while (i < lines.length) {
                    const line = lines[i];
                    if (/^### (.+)/.test(line)) { output.push(`<h3>${line.replace(/^### /, '')}</h3>`); i++; continue; }
                    if (/^## (.+)/.test(line))  { output.push(`<h2>${line.replace(/^## /, '')}</h2>`); i++; continue; }
                    if (/^# (.+)/.test(line))   { output.push(`<h1>${line.replace(/^# /, '')}</h1>`); i++; continue; }
                    if (/^(-{3,}|\*{3,}|={3,})$/.test(line.trim())) { output.push('<hr>'); i++; continue; }
                    if (/^\x00CODE\d+\x00$/.test(line.trim())) {
                        const idx = parseInt(line.match(/\x00CODE(\d+)\x00/)[1]);
                        output.push(codeBlocks[idx]); i++; continue;
                    }
                    if (/^[\*\-] (.+)/.test(line)) {
                        const items = [];
                        while (i < lines.length && /^[\*\-] (.+)/.test(lines[i])) { items.push(`<li>${lines[i].replace(/^[\*\-] /, '')}</li>`); i++; }
                        output.push(`<ul>${items.join('')}</ul>`); continue;
                    }
                    if (/^\d+\. (.+)/.test(line)) {
                        const items = [];
                        while (i < lines.length && /^\d+\. (.+)/.test(lines[i])) { items.push(`<li>${lines[i].replace(/^\d+\. /, '')}</li>`); i++; }
                        output.push(`<ol>${items.join('')}</ol>`); continue;
                    }
                    if (line.trim() === '') { output.push('<br>'); i++; continue; }
                    output.push(`<p>${line}</p>`); i++;
                }
                let html = output.join('');
                codeBlocks.forEach((block, idx) => { html = html.replace(new RegExp(`\x00CODE${idx}\x00`, 'g'), block); });
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/_([^_\n]+)_/g, '<em>$1</em>');
                return html;
            }

            highlightText(text, terms) {
                let safe = this.escapeHtml(text);
                if (!terms || terms.length === 0) return safe;
                const safeTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                const pattern = new RegExp(`(${safeTerms.join('|')})`, 'gi');
                return safe.replace(pattern, '<mark>$1</mark>');
            }

            // ── Render prompts ───────────────────────────────────────────────────────
            renderPrompts() {
                const prompts = this.promptManager.getAll();
                const fragment = document.createDocumentFragment();
                const searchTokens = this.searchTerm.toLowerCase().split(/\s+/).filter(Boolean);

                const filtered = prompts.filter(p => {
                    const pTags = p.category ? p.category.split(',').map(t => t.trim()) : [];
                    const matchesCat = this.activeCategory === 'all' || pTags.some(tag =>
                        tag === this.activeCategory || tag.startsWith(this.activeCategory + '/')
                    );
                    const nameLower = p.name.toLowerCase();
                    const contentLower = p.content.toLowerCase();
                    const matchesSearch = searchTokens.length === 0 || searchTokens.every(token =>
                        nameLower.includes(token) || contentLower.includes(token)
                    );
                    return matchesCat && matchesSearch;
                });

                if (filtered.length === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    emptyState.textContent = 'No prompts found.';
                    this.grid.innerHTML = '';
                    this.grid.appendChild(emptyState);
                    return;
                }

                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'prompt-card';
                    card.dataset.id = p.id;
                    if (this.selectedPromptId === p.id) card.classList.add('selected');

                    const tagsHtml = p.category
                        ? p.category.split(',').map(tag => {
                            const trimmed = tag.trim();
                            const leaf = trimmed.split('/').pop();
                            return `<span class="card-category" title="${this.escapeHtml(trimmed)}" onclick="event.stopPropagation(); setCategory('${trimmed.replace(/'/g, "\\'")}')">
                                ${this.escapeHtml(leaf)}
                            </span>`;
                          }).join('')
                        : '';

                    // Plain-text snippet (strip basic markdown syntax)
                    const snippet = p.content
                        .replace(/```[\s\S]*?```/g, '[code]')
                        .replace(/#{1,6}\s/g, '')
                        .replace(/[*_`]/g, '')
                        .replace(/\n+/g, ' ')
                        .trim()
                        .substring(0, 220);

                    const titleHtml = this.highlightText(p.name, searchTokens);

                    card.innerHTML = `
                        <div class="card-clickable" onclick="selectPrompt('${p.id}')">
                            <div class="card-title">${titleHtml}</div>
                            ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
                            <div class="card-snippet">${this.escapeHtml(snippet)}</div>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); copyPrompt('${p.id}')">Copy</button>
                            <button class="action-btn" onclick="event.stopPropagation(); downloadPrompt('${p.id}')" title="Download as .md">↓</button>
                            <button class="action-btn" onclick="event.stopPropagation(); openEdit('${p.id}')">Edit</button>
                            <button class="action-btn btn-delete" onclick="event.stopPropagation(); deletePrompt('${p.id}')">Del</button>
                        </div>
                    `;
                    fragment.appendChild(card);
                });

                this.grid.innerHTML = '';
                this.grid.appendChild(fragment);
            }

            // ── Prompt actions ───────────────────────────────────────────────────────
            copyPrompt(id) {
                const prompt = this.promptManager.get(id);
                if (prompt) this.copyText(prompt.content);
            }

            downloadPrompt(id) {
                const p = this.promptManager.get(id);
                if (!p) return;
                const blob = new Blob([p.content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${p.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                a.click();
                URL.revokeObjectURL(url);
            }

            copyText(text) {
                const variables = [...text.matchAll(/\{\{(.*?)\}\}/g)];
                if (variables.length > 0) {
                    this.openVarModal(text, variables);
                } else {
                    navigator.clipboard.writeText(text);
                    this.showToast('Copied!');
                }
            }

            copyCodeBlock(btn) {
                const pre = btn.nextElementSibling;
                if (pre) {
                    navigator.clipboard.writeText(pre.innerText);
                    const original = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = original, 2000);
                }
            }

            deletePrompt(id) {
                if (confirm('Delete this prompt?')) {
                    if (this.selectedPromptId === id) this.clearDetailPanel();
                    this.promptManager.delete(id);
                    this.renderPrompts();
                    this.renderCategories();
                }
            }

            deleteAll() {
                const count = this.promptManager.getAll().length;
                if (count === 0) return this.showToast('No prompts to delete');
                if (confirm(`Delete all ${count} prompt${count !== 1 ? 's' : ''}? This cannot be undone.`)) {
                    this.promptManager.prompts = [];
                    this.promptManager.categoryOrder = [];
                    this.promptManager.save();
                    this.promptManager.saveOrder();
                    this.activeCategory = 'all';
                    this.clearDetailPanel();
                    this.renderPrompts();
                    this.renderCategories();
                    this.showToast('All prompts deleted');
                }
            }

            // ── Variable modal ───────────────────────────────────────────────────────
            openVarModal(text, variables) {
                this.pendingCopyText = text;
                this.varInputsContainer.innerHTML = '';
                const uniqueVars = [...new Set(variables.map(m => m[1]))];
                uniqueVars.forEach(v => {
                    const label = document.createElement('label');
                    label.style.cssText = 'display:block; margin-bottom:0.4rem; color:var(--text-secondary); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;';
                    label.textContent = v;
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.dataset.varName = v;
                    input.placeholder = `Value for ${v}`;
                    this.varInputsContainer.appendChild(label);
                    this.varInputsContainer.appendChild(input);
                });
                this.varModal.classList.add('open');
                setTimeout(() => { const first = this.varInputsContainer.querySelector('input'); if (first) first.focus(); }, 100);
            }

            closeVarModal() {
                this.varModal.classList.remove('open');
                this.pendingCopyText = null;
            }

            handleVarSubmit() {
                if (!this.pendingCopyText) return;
                const inputs = this.varInputsContainer.querySelectorAll('input');
                const varMap = {};
                inputs.forEach(input => { varMap[input.dataset.varName] = input.value || ''; });
                const finalText = this.pendingCopyText.replace(/\{\{(.*?)\}\}/g, (match, varName) => {
                    return varMap.hasOwnProperty(varName) ? varMap[varName] : match;
                });
                navigator.clipboard.writeText(finalText);
                this.closeVarModal();
                this.showToast('Copied with variables!');
            }

            // ── Tag input ────────────────────────────────────────────────────────────
            handleTagInput() { this.renderTagPreview(); this.renderTagSuggestions(); }

            renderTagPreview() {
                const tags = this.modalCategory.value.split(',').map(t => t.trim()).filter(Boolean);
                this.tagPreview.innerHTML = tags.map(tag => `<span class="tag-chip">${this.escapeHtml(tag)}</span>`).join('');
            }

            renderTagSuggestions() {
                const currentTags = this.modalCategory.value.split(',').map(t => t.trim()).filter(Boolean);
                const allCats = this.promptManager.getCategories();
                const suggestions = allCats.filter(cat => !currentTags.includes(cat));
                this.tagSuggestions.innerHTML = suggestions.map(tag =>
                    `<span class="tag-suggestion-item" onclick="window.addTag('${tag.replace(/'/g, "\\'")}')">${this.escapeHtml(tag)}</span>`
                ).join('');
            }

            addTag(tag) {
                const current = this.modalCategory.value.trim();
                if (current && !current.endsWith(',')) this.modalCategory.value += ', ';
                this.modalCategory.value += tag + ', ';
                this.handleTagInput();
                this.modalCategory.focus();
            }

            // ── Modal editor ─────────────────────────────────────────────────────────
            setEditorMode(mode) {
                const panes = document.getElementById('editorPanes');
                panes.className = `editor-panes mode-${mode}`;
                document.querySelectorAll('.preview-toggle').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById(`mode${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
                if (btn) btn.classList.add('active');
                if (mode !== 'edit') this.updateModalPreview();
            }

            updateModalPreview() {
                const preview = document.getElementById('modalPreview');
                if (!preview) return;
                const text = document.getElementById('modalContent').value;
                preview.innerHTML = this.parseMarkdown(text) || '<span style="opacity:0.4; font-style:italic;">Nothing to preview yet…</span>';
            }

            openModal(id = null) {
                this.editingId = id;
                if (id) {
                    const p = this.promptManager.get(id);
                    if (p) {
                        this.modalName.value = p.name;
                        this.modalCategory.value = p.category || '';
                        this.modalContent.value = p.content;
                    }
                } else {
                    this.modalName.value = '';
                    this.modalCategory.value = '';
                    this.modalContent.value = '';
                }
                this.handleTagInput();
                this.setEditorMode('edit');
                this.modal.classList.add('open');
            }

            closeModal() { this.modal.classList.remove('open'); }

            handleSaveModal() {
                const name = this.modalName.value.trim();
                const category = this.modalCategory.value.trim();
                const content = this.modalContent.value.trim();
                if (!name || !content) return alert('Name and Content required');
                const data = { name, category, content };
                if (this.editingId) {
                    this.promptManager.update(this.editingId, data);
                } else {
                    this.promptManager.add(data);
                }
                this.renderPrompts();
                this.renderCategories();
                this.closeModal();
                // Refresh detail panel if currently showing the edited prompt
                if (this.selectedPromptId && this.editingId === this.selectedPromptId) {
                    this.renderDetailPanel(this.selectedPromptId);
                }
            }

            // ── Category manager ─────────────────────────────────────────────────────
            openCatManager() {
                const list = document.getElementById('catManagerList');
                list.innerHTML = '';
                const categories = Array.from(this.promptManager.getCategories()).sort();
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'category-btn';
                    btn.textContent = cat;
                    btn.style.border = '1px solid var(--border)';
                    btn.onclick = () => {
                        const newName = prompt('Rename category:', cat);
                        if (newName && newName.trim() !== '' && newName !== cat) {
                            this.promptManager.renameCategory(cat, newName.trim());
                            this.renderPrompts();
                            this.renderCategories();
                            this.openCatManager();
                            this.showToast('Category Renamed');
                        }
                    };
                    list.appendChild(btn);
                });
                document.getElementById('catModal').classList.add('open');
            }

            // ── Sync ─────────────────────────────────────────────────────────────────
            openSyncModal() {
                document.getElementById('syncUrlInput').value = this.promptManager.syncUrl;
                document.getElementById('syncOnLoad').checked = this.promptManager.syncOnLoad;
                document.getElementById('syncModal').classList.add('open');
            }

            async handleSync() {
                const urlInput = document.getElementById('syncUrlInput');
                const onLoadCheck = document.getElementById('syncOnLoad');
                const url = urlInput.value.trim();
                if (!url) return alert('Please enter a URL');
                const confirmBtn = document.getElementById('confirmSync');
                const statusEl = document.getElementById('syncStatus');
                confirmBtn.textContent = 'Syncing…';
                confirmBtn.disabled = true;
                this.promptManager.saveSyncSettings(url, onLoadCheck.checked);
                try {
                    const incoming = await this.promptManager.fetchFromUrl(url);
                    const { added, skipped } = this.promptManager.mergePrompts(incoming);
                    this.renderPrompts(); this.renderCategories();
                    document.getElementById('syncModal').classList.remove('open');
                    const msg = added > 0
                        ? `✓ Synced: ${added} new prompt${added !== 1 ? 's' : ''} added${skipped ? `, ${skipped} skipped` : ''}`
                        : `✓ Up to date — no new prompts${skipped ? ` (${skipped} skipped)` : ''}`;
                    statusEl.textContent = msg;
                    this.showToast(added > 0 ? `+${added} prompts synced!` : 'Already up to date');
                    setTimeout(() => statusEl.textContent = '', 8000);
                } catch (err) {
                    this.showToast('Sync failed!');
                    statusEl.textContent = `✗ ${err.message}`;
                    setTimeout(() => statusEl.textContent = '', 8000);
                } finally {
                    confirmBtn.textContent = 'Sync Now';
                    confirmBtn.disabled = false;
                }
            }

            async autoSync() {
                const { syncUrl, syncOnLoad } = this.promptManager;
                if (!syncOnLoad || !syncUrl) return;
                const statusEl = document.getElementById('syncStatus');
                statusEl.textContent = '⏳ Auto-syncing…';
                try {
                    const incoming = await this.promptManager.fetchFromUrl(syncUrl);
                    const { added } = this.promptManager.mergePrompts(incoming);
                    if (added > 0) {
                        this.renderPrompts(); this.renderCategories();
                        statusEl.textContent = `✓ Auto-synced: +${added} new prompt${added !== 1 ? 's' : ''}`;
                    } else {
                        statusEl.textContent = '✓ Up to date';
                    }
                    setTimeout(() => statusEl.textContent = '', 5000);
                } catch (err) {
                    statusEl.textContent = `✗ Auto-sync failed: ${err.message}`;
                    setTimeout(() => statusEl.textContent = '', 8000);
                }
            }

            // ── Import / Export ──────────────────────────────────────────────────────
            exportPrompts() {
                const prompts = this.promptManager.getAll();
                if (prompts.length === 0) return this.showToast('Nothing to export');
                const exportData = { version: 1, timestamp: new Date().toISOString(), prompts };
                const content = JSON.stringify(exportData, null, 2);
                const blob = new Blob([content], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `prompts_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast('Exported JSON');
            }

            importPrompts(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        let imported = [];
                        if (Array.isArray(json)) { imported = json; }
                        else if (json.prompts && Array.isArray(json.prompts)) { imported = json.prompts; }
                        else throw new Error('Invalid format: Root must be array or versioned object');
                        let importedCount = 0, skippedCount = 0;
                        imported.forEach(p => {
                            if (p.name && typeof p.name === 'string' && p.content && typeof p.content === 'string') {
                                if (p.content.length > 100000) { console.warn(`Skipping "${p.name}" - Content exceeds 100k chars.`); return; }
                                const newPromptData = {
                                    name: p.name.substring(0, 200),
                                    category: (p.category && typeof p.category === 'string') ? p.category.substring(0, 500) : '',
                                    content: p.content
                                };
                                const isDuplicate = this.promptManager.getAll().some(existing =>
                                    existing.name === newPromptData.name && existing.content === newPromptData.content
                                );
                                if (isDuplicate) { skippedCount++; return; }
                                this.promptManager.add(newPromptData);
                                importedCount++;
                            }
                        });
                        this.renderPrompts(); this.renderCategories();
                        let msg = `Imported ${importedCount} prompts`;
                        if (skippedCount > 0) msg += `, Skipped ${skippedCount} duplicates`;
                        this.showToast(msg);
                    } catch (err) {
                        alert('Invalid JSON file: ' + err.message);
                    }
                    document.getElementById('importInput').value = '';
                };
                reader.readAsText(file);
            }

            // ── Utilities ────────────────────────────────────────────────────────────
            showToast(msg = 'Copied!') {
                this.toast.textContent = msg;
                this.toast.classList.add('show');
                setTimeout(() => this.toast.classList.remove('show'), 2000);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // ─── Init ────────────────────────────────────────────────────────────────────
        const promptManager = new PromptManager();
        const uiManager = new UIManager(promptManager);
        uiManager.init();
    </script>
</body>
